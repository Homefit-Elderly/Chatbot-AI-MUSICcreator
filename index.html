<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse — the AI that writes songs and sings them</title>
<meta name="description" content="Tell Muse what the song should be about. It writes the lyrics, then sings and plays them.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<style>
/* ============================================================
   Muse — chat interface
   ============================================================ */
:root{
  --bg:#ffffff;
  --side:#f9f9f9;
  --bubble:#f4f4f4;
  --ink:#0d0d0d;
  --ink-2:#5d5d5d;
  --ink-3:#8f8f8f;
  --line:#e5e5e5;
  --line-2:#ececec;
  --accent:#5b4be0;
  --accent-soft:#efedfd;
  --hot:#e5533c;
  --send:#0d0d0d;
  --send-ink:#ffffff;
  --font:"Söhne",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#212121; --side:#171717; --bubble:#303030;
    --ink:#ececec; --ink-2:#b4b4b4; --ink-3:#8f8f8f;
    --line:#333333; --line-2:#2a2a2a;
    --accent:#9d90ff; --accent-soft:#2b2740; --hot:#ff8a72;
    --send:#ffffff; --send-ink:#0d0d0d;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit}

/* ---------- app shell ---------- */
.app{display:flex;height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
.sidebar{
  width:260px;flex:none;background:var(--side);border-right:1px solid var(--line-2);
  display:flex;flex-direction:column;padding:10px;transition:margin-left .2s ease;
}
.brand{display:flex;align-items:center;gap:9px;padding:8px 8px 14px;font-weight:600;font-size:15px}
.brand .mark{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--hot));color:#fff;font-size:13px;
}
.newbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:10px;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  font-size:14px;font-weight:500;cursor:pointer;text-align:left;
}
.newbtn:hover{background:var(--bubble)}
.hist-label{padding:18px 10px 6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.hist button{
  width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:transparent;
  color:var(--ink-2);font-size:14px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hist button:hover{background:var(--bubble);color:var(--ink)}
.hist button.on{background:var(--bubble);color:var(--ink)}
.hist .empty{padding:8px 10px;font-size:13px;color:var(--ink-3)}
.side-foot{border-top:1px solid var(--line-2);padding:10px 8px 4px;font-size:12.5px;color:var(--ink-3)}
.side-foot a{color:inherit}

/* ---------- main column ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line-2);font-size:14.5px;font-weight:600;
}
.topbar .model{color:var(--ink-2);font-weight:500}
.topbar .tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);
}
.menu{display:none;background:none;border:0;color:var(--ink);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
.menu:hover{background:var(--bubble)}

.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:768px;margin:0 auto;padding:26px 20px 40px}

/* ---------- empty state ---------- */
.empty-state{
  min-height:calc(100vh - 220px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:24px;padding:20px;
}
.empty-state h1{font-size:29px;font-weight:600;letter-spacing:-.01em;margin:0}
.empty-state p{margin:0;color:var(--ink-2);font-size:15px;max-width:460px}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
@media(max-width:640px){.seeds{grid-template-columns:1fr}}
.seed{
  text-align:left;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;font-size:14px;line-height:1.45;
}
.seed b{display:block;font-weight:600;margin-bottom:2px}
.seed span{color:var(--ink-3);font-size:13px}
.seed:hover{background:var(--bubble)}

/* ---------- messages ---------- */
.msg{display:flex;gap:14px;margin-bottom:26px}
.msg.user{justify-content:flex-end}
.msg.user .body{
  background:var(--bubble);padding:11px 16px;border-radius:20px;max-width:78%;
  white-space:pre-wrap;word-break:break-word;
}
.avatar{
  width:26px;height:26px;border-radius:50%;flex:none;margin-top:3px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--hot));color:#fff;font-size:12px;
}
.msg.bot .body{flex:1;min-width:0}
.msg.bot p{margin:0 0 12px}
.msg.bot p:last-child{margin-bottom:0}
.caret{display:inline-block;width:8px;height:16px;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.dots span{
  display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--ink-3);
  animation:bounce 1.2s infinite;
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- lyric sheet ---------- */
.sheet{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0 16px;
}
.sheet-head{
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;
  gap:10px;flex-wrap:wrap;background:var(--side);
}
.sheet-head b{font-size:15.5px;font-weight:600}
.sheet-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;
  background:var(--hot);color:#fff;
}
.sheet-body{padding:14px 16px}
.section-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  margin:12px 0 5px;text-transform:uppercase;
}
.section-label:first-child{margin-top:0}
.line{padding:1px 0;font-size:15.5px;line-height:1.75;border-radius:5px;transition:color .15s}
.line.dim{color:var(--ink-2)}
.line.active{color:var(--ink);font-weight:500}
.syl{transition:color .1s,background .1s;border-radius:4px;padding:0 .5px}
.syl.sung{color:var(--accent)}
.syl.now{background:var(--accent);color:#fff}

/* ---------- create + player ---------- */
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.create{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:0;
  background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;
}
.create:hover{filter:brightness(1.07)}
.create:disabled{opacity:.6;cursor:default}
.mini{
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink-2);font-size:13.5px;cursor:pointer;
}
.mini:hover{background:var(--bubble);color:var(--ink)}
select.mini{padding:8px 10px}

.player{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
  background:var(--side);border:1px solid var(--line);margin-top:14px;
}
.pbtn{
  width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:grid;place-items:center;cursor:pointer;
}
.pbtn svg{width:16px;height:16px;fill:currentColor}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.bar{height:4px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
canvas.viz{width:64px;height:34px;flex:none}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:0 20px 18px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.composer{
  max-width:768px;margin:0 auto;border:1px solid var(--line);border-radius:26px;
  background:var(--bg);padding:8px 8px 8px 18px;display:flex;align-items:flex-end;gap:8px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.composer:focus-within{border-color:var(--ink-3)}
.composer textarea{
  flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--ink);
  font-family:inherit;font-size:16px;line-height:1.5;max-height:180px;padding:9px 0;
}
.composer textarea::placeholder{color:var(--ink-3)}
.sendbtn{
  width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--send);color:var(--send-ink);
  display:grid;place-items:center;cursor:pointer;
}
.sendbtn:disabled{opacity:.28;cursor:default}
.sendbtn svg{width:17px;height:17px;fill:currentColor}
.disclaimer{max-width:768px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--ink-3)}

@media(max-width:860px){
  .sidebar{position:absolute;z-index:30;height:100%;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sidebar.hide{margin-left:-281px}
  .menu{display:block}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar hide" id="sidebar">
    <div class="brand"><span class="mark">♪</span> Muse</div>
    <button class="newbtn" id="newBtn">＋ New song</button>
    <div class="hist-label">Songs</div>
    <div class="hist" id="hist"><div class="empty">Nothing yet.</div></div>
    <div class="side-foot">
      Muse 0.4 · open source ·
      <a href="https://github.com/your-username/muse">GitHub</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu" id="menuBtn" aria-label="Menu">☰</button>
      <span>Muse <span class="model">0.4</span></span>
      <span class="tag">WRITES · SINGS</span>
    </div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="What should the song be about?"></textarea>
        <button class="sendbtn" id="send" disabled aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 4l7 7h-4.5v9h-5v-9H5z"/></svg>
        </button>
      </div>
      <div class="disclaimer">Muse writes the lyrics and sings them in your browser. Everything you hear is synthesized live — no audio files, no server.</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   Muse — an AI that writes a song from your idea and sings it.
   Pure front-end: lyrics are generated from your words, and the
   voice is a formant synthesizer driven by the Web Audio API.
   ============================================================ */

/* ---------- deterministic randomness ---------- */
function hashString(s){
  let h = 2166136261;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function makeRng(seed){
  let x = seed >>> 0;
  return function(){
    x = x + 0x6D2B79F5 | 0;
    let t = Math.imul(x ^ x >>> 15, 1 | x);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r()*arr.length)];
function shuffled(r, arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- reading the idea ---------- */
const STOP = new Set(("a an the about of for on in at to and or but with without my your his her its our their this that these those is are was were be been am i you he she it we they me him them us song about make write create sing sings singing music track tune song's please can could would should like want need very really just some any all more most into from as if then than so it's im i'm dont don't after before again still when while because over under through every never always another other gonna wanna maybe kinda sorta lot lots make made makes bit").split(" "));

const DARK  = ['rain','sad','melancholy','night','lonely','alone','grief','winter','fog','slow','ghost','empty','cold','saudade','blue','miss','missing','goodbye','leaving','left','lost','tired','funeral','regret','last'];
const BRIGHT= ['sun','happy','summer','dance','bright','joy','festival','beach','party','morning','sunrise','warm','gold','love','wedding','friends','home','birthday','free','laugh'];
const AGGRO = ['fuck','shit','damn','hell','bitch','ass','piss','bastard','crap','angry','rage','furious','hate','scream','loud','riot','fight','wasted','fed up','pissed','revenge','burn'];

function keywords(text){
  return (text||'').toLowerCase()
    .replace(/[^\p{L}\p{N}\s'-]/gu,' ')
    .split(/\s+/)
    .filter(w => w.length>2 && !STOP.has(w))
    .slice(0,14);
}
/* Pull out the phrases the user actually wrote — words that sat next to
   each other survive as a unit ("last train", "saying goodbye"), which
   sings far better than a lone adjective dropped into a noun slot. */
function phrasesOf(text){
  const toks = (text||'').toLowerCase().replace(/[^\p{L}\p{N}\s'-]/gu,' ').split(/\s+/).filter(Boolean);
  const out = []; let run = [];
  const flush = ()=>{
    for (let i=0;i<run.length-1;i++) out.push(run[i]+' '+run[i+1]);
    run = [];
  };
  toks.forEach(w=>{ if (w.length>2 && !STOP.has(w)) run.push(w); else flush(); });
  flush();
  // a phrase that starts with a verb ("goes wrong") can't stand in for a noun
  const VERBY = new Set("goes went come came comes keep keeps kept say says said get gets got give gives gave take takes took put puts make makes made pick picks does did doing had has have was were are is".split(" "));
  return [...new Set(out)].filter(p => !VERBY.has(p.split(' ')[0])).slice(0,6);
}

/* the user's own words make the best title */
const SMALL = new Set("a an the to in of at on and or for with from is it my your".split(" "));
function titleFromIdea(text){
  let words = (text||'').split(/[,—–-]|\bthat\b/)[0]
    .replace(/[^\p{L}\p{N}\s'’]/gu,' ').split(/\s+/).filter(Boolean);
  while (words.length && SMALL.has(words[0].toLowerCase())) words.shift();
  words = words.slice(0,4);
  while (words.length > 1 && SMALL.has(words[words.length-1].toLowerCase())) words.pop();
  if (!words.length) return 'Untitled';
  return words.map((w,i)=>{
    const lw = w.toLowerCase();
    return (i>0 && SMALL.has(lw)) ? lw : lw.charAt(0).toUpperCase()+lw.slice(1);
  }).join(' ');
}
/* "a open road" → "an open road" */
function aan(s){
  return s.replace(/\ba (?=(?:[aeiou]|honest|hour))/gi, m => m[0]==='A' ? 'An ' : 'an ');
}

/* ---------- word banks ---------- */
const BANK = {
  dark: {
    img:['rain','streetlight','platform','window','coat','ashtray','static','ceiling','ocean','December','headlights','hallway','payphone','kitchen light','last bus','empty chair','bruise','tide'],
    verb:['hold','carry','bury','keep','count','follow','swallow','answer','forgive'],
    ing:['holding','counting','waiting','driving','burning','leaving','pretending'],
    adj:['quiet','cold','half-empty','honest','tired','blue','slow','open','unfinished','patient']
  },
  bright:{
    img:['morning','kitchen','radio','sunlight','harbour','open road','front step','summer','back seat','first train','orange sky','cheap wine','tin roof','june'],
    verb:['keep','carry','follow','hold','call','chase','deserve','begin'],
    ing:['dancing','laughing','driving','running','singing','waking','falling'],
    adj:['golden','loud','easy','wide open','ridiculous','young','bright','lucky','warm']
  },
  aggro:{
    img:['broken glass','red light','front door','amplifier','engine','pavement','fist','siren','last straw','cheap lock','tab','bad year'],
    verb:['break','burn','leave','shout','drop','take','forget','wreck'],
    ing:['screaming','breaking','burning','leaving','driving','shouting'],
    adj:['done','loud','wired','sick of it','out of patience','honest','ugly','finished']
  }
};

const VERSE_LINES = {
  dark:[
    "I left the {img} on for you",
    "Nobody warned me about the {kw}",
    "There's a {adj} {img} in the back of my head",
    "You said {kw}, and I heard everything else",
    "I {verb} the {kw} like it still belongs to me",
    "The {img} already knows my name",
    "{ing} in the dark till the morning shows up",
    "Every {kw} sounds like a door closing",
    "I keep the {kw} where the {img} can't reach it",
    "It's {adj} out here without the {kw}",
    "Somebody's {ing} and it isn't me",
    "The {img} is {adj} tonight and so am I"
  ],
  bright:[
    "Woke up {ing} about the {kw}",
    "The {img} is {adj} and I'm not arguing",
    "You brought the {kw} and I brought the noise",
    "Nobody here is {ing} alone tonight",
    "I'd {verb} the {kw} all over again",
    "There's a {adj} {img} with your name on it",
    "We were {ing} before we knew the words",
    "Give me the {kw} and a {adj} {img}",
    "The {img} says yes and I believe it",
    "Everything good started with the {kw}"
  ],
  aggro:[
    "I'm done {ing} for the {kw}",
    "Take the {kw}, I kept the {img}",
    "Say it again to my face this time",
    "You want the {adj} version? Here it is",
    "I'll {verb} the {img} before I call you back",
    "Nobody's {ing} — that's the whole problem",
    "The {img} went first, the {kw} went after",
    "I'm {adj} and I'm not lowering my voice",
    "Keep the {kw}. I never wanted it clean"
  ]
};

const CHORUS_LINES = {
  dark:[
    "So let the {kw} go",
    "I'm not asking twice tonight",
    "And the {img} keeps falling anyway",
    "Say it slow, say it {adj}",
    "I'll be here when the {img} runs out"
  ],
  bright:[
    "So hold the {kw} up",
    "We're not going home tonight",
    "And the {img} keeps on going anyway",
    "Say it loud, say it {adj}",
    "I'll be here when the {img} comes back"
  ],
  aggro:[
    "So burn the {kw} down",
    "I'm not asking twice tonight",
    "And the {img} can stay where it fell",
    "Say it {adj} or don't say it at all",
    "I'll be gone before the {img} lands"
  ]
};

const GENRE = {
  dark:['slow indie ballad','late-night piano song','ambient folk','slowcore','torch song'],
  bright:['warm indie pop song','summer soul number','open-road anthem','folk-pop song'],
  aggro:['punk song','industrial stomp','garage rock number','post-punk track']
};

/* ---------- the songwriter ---------- */
function writeSong(idea, opts){
  opts = opts || {};
  const t = (idea||'').toLowerCase();
  const seed = hashString(t + (opts.salt||''));
  const r = makeRng(seed);

  const aggro  = AGGRO.some(w=>t.includes(w));
  const dark   = !aggro && DARK.some(w=>t.includes(w));
  const bright = !aggro && !dark && BRIGHT.some(w=>t.includes(w));
  let mood = aggro ? 'aggro' : dark ? 'dark' : bright ? 'bright' : (r()<0.55 ? 'dark' : 'bright');
  if (opts.mood) mood = opts.mood;

  const bank = BANK[mood];
  const kws = keywords(idea);
  // sort the user's words into the slots they actually fit
  const gerunds = kws.filter(w => /ing$/.test(w) && w.length > 4);
  // bare adjectives read badly in a noun slot ("every last sounds like…"),
  // so they only get to appear inside one of the user's own phrases
  const ADJ_ONLY = new Set("last first next big small old new good bad real whole only best worst same different hard easy long short late early own".split(" "));
  const nouns   = kws.filter(w => !/ing$|ed$|ly$/.test(w) && !ADJ_ONLY.has(w))
                     .map(w => w.replace(/['’]s$/,''));
  const phrases = phrasesOf(idea);
  // only multi-word gerund phrases lose their article ("the saying goodbye")
  const gerundish = phrases.filter(p => /ing$/.test(p.split(' ')[0]) && p.includes(' '));
  // phrases first — they carry the user's actual image
  const kwPool  = [...phrases, ...nouns, ...kws, 'night','light','name']
                    .filter((v,i,a)=>v && a.indexOf(v)===i);

  // fill a template with the user's own words first, the bank second
  let kwCursor = 0;
  const nextKw = () => kwPool[(kwCursor++) % kwPool.length];
  function fill(tpl){
    return tpl
      .replace(/\{kw\}/g,  () => nextKw())
      .replace(/\{img\}/g, () => pick(r, bank.img))
      .replace(/\{adj\}/g, () => pick(r, bank.adj))
      .replace(/\{verb\}/g,() => pick(r, bank.verb))
      .replace(/\{ing\}/g, () => (gerunds.length && r()<0.55) ? pick(r, gerunds) : pick(r, bank.ing));
  }
  // "without the saying goodbye" → "without saying goodbye"
  function tidy(line){
    gerundish.forEach(g=>{
      line = line.replace(new RegExp('\\b(the|a) ' + g.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), g);
    });
    return aan(line).replace(/\s{2,}/g,' ').trim().replace(/^./, c=>c.toUpperCase());
  }

  const write = tpl => tidy(fill(tpl));
  const vPool = shuffled(r, VERSE_LINES[mood]);
  const verse1 = vPool.slice(0,4).map(write);
  const verse2 = vPool.slice(4,8).map(write);
  const cPool  = shuffled(r, CHORUS_LINES[mood]);
  const chorus = [cPool[0], cPool[1], cPool[2], cPool[3] || cPool[0]].map(write);

  // title: the user's own phrase, tidied
  const title = titleFromIdea(idea);

  // musical decisions
  const keys = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const root = 48 + Math.floor(r()*10);
  let bpm = mood==='aggro' ? Math.round(140+r()*22)
          : mood==='bright' ? Math.round(96+r()*26)
          : Math.round(66+r()*22);
  if (/slow|ballad|lullab|quiet/.test(t)) bpm = Math.round(58+r()*14);
  if (/fast|dance|club|run/.test(t))      bpm = Math.round(122+r()*26);
  if (opts.bpm) bpm = opts.bpm;

  const scale = mood==='aggro' ? 'minorPent'
              : mood==='dark'  ? (r()<0.5 ? 'minorPent' : 'aeolian')
              : (r()<0.5 ? 'majorPent' : 'lydian');

  let register = opts.register;
  if (!register){
    if (/soprano|female|high voice|choir|girl/.test(t)) register='soprano';
    else if (/tenor|male|man singing|guy/.test(t))      register='tenor';
    else if (/bass|baritone|deep voice|monk/.test(t))   register='bass';
    else register = mood==='aggro' ? 'tenor' : (r()<0.5 ? 'alto' : 'tenor');
  }

  return {
    idea, seed, mood, aggro, title, bpm, scale, root, register,
    keyName: keys[root%12] + (['minorPent','aeolian'].includes(scale) ? ' minor' : ' major'),
    genre: pick(r, GENRE[mood]),
    hook: chorus[0],
    sections:[
      { label:'Verse 1', lines:verse1 },
      { label:'Chorus',  lines:chorus },
      { label:'Verse 2', lines:verse2 },
      { label:'Chorus',  lines:chorus }
    ]
  };
}

/* the little paragraph the assistant says before the lyrics */
function describe(song){
  const feel = {
    dark:'keeps the verses close and quiet, then opens up on the chorus',
    bright:'stays warm the whole way through and lifts on the chorus',
    aggro:'starts annoyed and stops pretending by the second verse'
  }[song.mood];
  const voice = {soprano:'a soprano',alto:'an alto',tenor:'a tenor',bass:'a bass'}[song.register];
  return aan(`Here's what I'm going to make: a ${song.genre} in ${song.keyName} at ${song.bpm} bpm, sung by ${voice}. `)
       + `It's about ${song.idea.replace(/\.$/,'')} — the arrangement ${feel}, and the whole thing hangs on the line "${song.hook}". `
       + `Two verses, the chorus twice. Here are the words:`;
}
/* ============================================================
   2 · SINGING — syllables, arrangement, synthesis
   ============================================================ */

const SCALES = {
  minorPent:[0,3,5,7,10],
  majorPent:[0,2,4,7,9],
  aeolian:[0,2,3,5,7,8,10],
  lydian:[0,2,4,6,7,9,11]
};
/* three resonances per vowel — a sawtooth through bandpass filters
   tuned to these reads as a human vowel */
const FORMANTS = {
  a:[730,1090,2440], e:[530,1840,2480], i:[270,2290,3010],
  o:[570,840,2410],  u:[300,870,2240],  m:[280,900,2200]
};
const REGISTERS = {
  soprano:{shift:1.24, oct:26, name:'soprano'},
  alto:   {shift:1.10, oct:21, name:'alto'},
  tenor:  {shift:1.00, oct:14, name:'tenor'},
  bass:   {shift:0.86, oct:7,  name:'bass'}
};
const VOWELS = {a:'a',á:'a',à:'a',ã:'a',â:'a',e:'e',é:'e',ê:'e',i:'i',í:'i',y:'i',o:'o',ó:'o',ô:'o',õ:'o',u:'u',ú:'u'};
const isVowel = c => !!VOWELS[c];
const mtof = m => 440 * Math.pow(2,(m-69)/12);

/* split a word into singable syllables */
function splitSyl(word){
  const c=[...word.toLowerCase()], parts=[]; let cur='';
  for (let i=0;i<c.length;i++){
    cur += c[i];
    if (isVowel(c[i])){
      while (i+1<c.length && isVowel(c[i+1])) cur += c[++i];       // diphthong
      if (i+2<c.length && !isVowel(c[i+1]) && isVowel(c[i+2])){    // V-CV
        parts.push(cur); cur='';
      } else if (i+3<c.length && !isVowel(c[i+1]) && !isVowel(c[i+2]) && isVowel(c[i+3])){
        cur += c[++i]; parts.push(cur); cur='';                    // VC-CV
      }
    }
  }
  if (cur){ if (parts.length) parts[parts.length-1]+=cur; else parts.push(cur); }
  return parts.length ? parts : [word];
}
function vowelOf(part){
  for (const ch of part.toLowerCase()) if (VOWELS[ch]) return VOWELS[ch];
  return 'm';
}
/* a whole line → [{txt, v}] keeping the original spelling for display */
function syllabifyLine(text){
  const out = [];
  text.split(/(\s+)/).forEach(tok=>{
    if (!tok) return;
    if (/^\s+$/.test(tok)){ if (out.length) out[out.length-1].txt += tok; return; }
    const m = tok.match(/^([^\p{L}]*)([\p{L}'’-]+)([^\p{L}]*)$/u);
    if (!m){ if (out.length) out[out.length-1].txt += tok; else out.push({txt:tok, v:'m'}); return; }
    const [, pre, core, post] = m;
    const parts = splitSyl(core);
    let cursor = 0;
    parts.forEach((p, i)=>{
      const raw = core.substr(cursor, p.length); cursor += p.length;
      out.push({ txt:(i===0?pre:'') + raw + (i===parts.length-1?post:''), v:vowelOf(p) });
    });
  });
  return out;
}

/* ---------- arrangement: turn the lyric sheet into scheduled events ---------- */
function scaleNote(root, sc, deg){
  const oct = Math.floor(deg/sc.length);
  return root + sc[((deg%sc.length)+sc.length)%sc.length] + 12*oct;
}
function arrange(song){
  const sc    = SCALES[song.scale];
  const beat  = 60/song.bpm;
  const step  = beat/2;                 // eighth note
  const barD  = beat*4;
  const reg   = REGISTERS[song.register] || REGISTERS.alto;
  const r     = makeRng(song.seed ^ 0x9e3779b9);
  const INTRO = 2, LINE_BARS = 2, OUTRO = 2;

  // bar-by-bar plan
  const plan = [];
  for (let i=0;i<INTRO;i++) plan.push({kind:'intro'});
  song.sections.forEach((sec, si)=>{
    const chorus = /chorus/i.test(sec.label);
    sec.lines.forEach((text, li)=>{
      plan.push({kind:'line', si, li, text, chorus});
      plan.push({kind:'hold', chorus});
    });
  });
  for (let i=0;i<OUTRO;i++) plan.push({kind:'outro'});

  const events = [], lines = [];
  const vibRate  = song.aggro ? 6.3 : 5.1 + r()*0.7;
  const vibDepth = song.aggro ? 0.006 : 0.013;
  let lastVocal = null;

  plan.forEach((bar, b)=>{
    const t0  = b * barD;
    const deg = (bar.chorus ? [3,4,0,5] : [0,5,3,4])[b % 4];
    const chordRoot = scaleNote(song.root, sc, deg);
    const full = bar.kind !== 'intro' && bar.kind !== 'outro';

    // pad
    [0,2,4].forEach((k,n)=>{
      events.push({t:t0, kind:'tone', f:mtof(scaleNote(chordRoot, sc, deg+k) + (n===2?12:0)),
                   dur:barD*0.96, type:'triangle', gain:0.05, filt:1600});
    });
    // bass
    events.push({t:t0,          kind:'tone', f:mtof(chordRoot-12), dur:beat*1.6, type:'sawtooth', gain:0.15, filt:320});
    events.push({t:t0+beat*2,   kind:'tone', f:mtof(chordRoot-12), dur:beat*1.6, type:'sawtooth', gain:0.13, filt:320});
    // drums
    if (full || bar.kind==='outro'){
      for (let s=0;s<8;s++){
        const t = t0 + s*step;
        if (s%2===1) events.push({t, kind:'noise', dur:0.06, gain:song.aggro?0.075:0.045});
        if (s===0 || s===4) events.push({t, kind:'tone', f:70, dur:0.17, type:'sine', gain:song.aggro?0.34:0.26, filt:200});
        if ((song.aggro || bar.chorus) && (s===2 || s===6)) events.push({t, kind:'noise', dur:0.2, gain:0.1});
      }
    }
    // instrumental hook in the intro / outro, where no one is singing
    if (!full){
      for (let s=0;s<8;s+=2){
        if (r()<0.7){
          const n = scaleNote(song.root+12, sc, deg + Math.floor(r()*5));
          events.push({t:t0+s*step, kind:'tone', f:mtof(n), dur:step*1.6,
                       type: song.aggro?'square':'triangle', gain:0.1, filt:4000});
        }
      }
    }

    // ---- the vocal line ----
    if (bar.kind === 'line'){
      const syls = syllabifyLine(bar.text);
      const span = LINE_BARS * 8;                       // eighths available
      const unit = syls.length > 12 ? span/(syls.length+2) : 1;
      const contour = bar.chorus ? [4,3,4,5,4,5,3,4,5,4,3,4,5,3,4,5]
                                 : [0,1,2,1,0,2,3,2,1,2,0,1,2,1,0,2];
      const lineSyls = [];
      syls.forEach((syl, k)=>{
        const t = t0 + (1 + k*unit) * step;
        const last = k === syls.length-1;
        const dur  = step * (last ? Math.max(2, unit*3) : unit*0.96);
        const note = scaleNote(song.root + reg.oct - 12, sc, deg + contour[k % contour.length]);
        const f = mtof(note);
        events.push({t, kind:'voice', f, dur, vowel:syl.v, gain: song.aggro?0.23:0.2,
                     reg:song.register, vibRate, vibDepth, from:lastVocal});
        lineSyls.push({txt:syl.txt, t, dur});
        lastVocal = f;
      });
      lines.push({si:bar.si, li:bar.li, text:bar.text, syls:lineSyls,
                  t0:lineSyls[0].t, t1:t0 + LINE_BARS*barD});
    }
  });

  events.sort((a,b)=>a.t-b.t);
  return { events, lines, dur: plan.length*barD + 0.6, song };
}

/* ---------- audio engine ---------- */
const Engine = (()=>{
  let ctx, master, analyser, data;
  let nodes=[], timer=null, startAt=0, idx=0, arr=null, cur=null, cb={};

  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.62;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    data = new Uint8Array(analyser.frequencyBinCount);
    master.connect(analyser); analyser.connect(ctx.destination);
  }

  function tone(e, at){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = e.type; o.frequency.value = e.f;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(e.gain, at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at+e.dur);
    o.connect(g);
    let out = g;
    if (e.filt){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=e.filt; g.connect(f); out=f; }
    out.connect(master);
    o.start(at); o.stop(at+e.dur+0.05);
    nodes.push(o);
  }

  function noise(e, at){
    const len = Math.max(1, Math.floor(ctx.sampleRate*e.dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i=0;i<len;i++) ch[i] = (Math.random()*2-1)*Math.pow(1-i/len,3);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const g = ctx.createGain(); g.gain.value = e.gain;
    const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=5200;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at); nodes.push(s);
  }

  /* the voice: glottal saw + breath → three formant bandpasses → envelope */
  function voice(e, at){
    const reg = REGISTERS[e.reg] || REGISTERS.alto;
    const o = ctx.createOscillator(); o.type='sawtooth';
    if (e.from && Math.abs(e.from-e.f) > 1){
      o.frequency.setValueAtTime(e.from, at);
      o.frequency.exponentialRampToValueAtTime(e.f, at+Math.min(0.08, e.dur*0.25)); // portamento
    } else o.frequency.setValueAtTime(e.f, at);

    const lfo = ctx.createOscillator(); lfo.frequency.value = e.vibRate;
    const lg = ctx.createGain();
    lg.gain.setValueAtTime(0, at);
    lg.gain.linearRampToValueAtTime(e.f*e.vibDepth, at+Math.min(0.3, e.dur*0.7));
    lfo.connect(lg); lg.connect(o.frequency);
    lfo.start(at); lfo.stop(at+e.dur+0.08);

    const bl = Math.max(1, Math.floor(ctx.sampleRate*Math.min(0.2, e.dur)));
    const bb = ctx.createBuffer(1, bl, ctx.sampleRate);
    const bc = bb.getChannelData(0);
    for (let i=0;i<bl;i++) bc[i] = Math.random()*2-1;
    const breath = ctx.createBufferSource(); breath.buffer = bb;
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(e.gain*0.45, at);
    bg.gain.exponentialRampToValueAtTime(0.0001, at+Math.min(0.16, e.dur));

    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(e.gain, at+Math.min(0.07, e.dur*0.3));
    env.gain.setValueAtTime(e.gain, at+e.dur*0.7);
    env.gain.exponentialRampToValueAtTime(0.0001, at+e.dur);

    o.connect(env); breath.connect(bg); bg.connect(env);

    const mix = ctx.createGain();
    (FORMANTS[e.vowel]||FORMANTS.a).forEach((f,i)=>{
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = Math.min(f*reg.shift, ctx.sampleRate/2-100);
      bp.Q.value = 7 + i*4;
      const g = ctx.createGain(); g.gain.value = [1,0.6,0.34][i];
      env.connect(bp); bp.connect(g); g.connect(mix);
    });
    const dry = ctx.createGain(); dry.gain.value = 0.13;
    env.connect(dry); dry.connect(mix);
    mix.connect(master);

    o.start(at); o.stop(at+e.dur+0.08);
    breath.start(at);
    nodes.push(o, lfo, breath);
  }

  function tick(){
    if (!arr) return;
    const now = ctx.currentTime;
    while (idx < arr.events.length && startAt + arr.events[idx].t < now + 0.35){
      const e = arr.events[idx++];
      const at = Math.max(now, startAt + e.t);
      if (e.kind === 'voice') voice(e, at);
      else if (e.kind === 'noise') noise(e, at);
      else tone(e, at);
    }
    if (now > startAt + arr.dur){ stop(); }
  }

  function play(id, arrangement, callbacks){
    if (cur === id){ stop(); return false; }
    stop(); ensure();
    if (ctx.state === 'suspended') ctx.resume();
    arr = arrangement; cur = id; cb = callbacks || {};
    idx = 0; startAt = ctx.currentTime + 0.12;
    timer = setInterval(tick, 40);
    tick();
    return true;
  }

  function stop(){
    if (timer){ clearInterval(timer); timer=null; }
    nodes.forEach(n=>{ try{ n.stop(); }catch(_){} });
    nodes = [];
    const done = cb.onEnd; cur = null; arr = null; cb = {};
    if (done) done();
  }

  return {
    play, stop,
    get playing(){ return cur; },
    elapsed(){ return ctx ? ctx.currentTime - startAt : 0; },
    levels(){ if (!analyser) return null; analyser.getByteFrequencyData(data); return data; }
  };
})();

/* ============================================================
   3 · CHAT INTERFACE
   ============================================================ */
const $  = s => document.querySelector(s);
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const thread = $('#thread'), scroller = $('#scroll'), input = $('#input'), sendBtn = $('#send');
let history = [];      // {title, node}
let lastSong = null;   // the song we're currently talking about
let songCount = 0;

const SEEDS = [
  { t:"Missing the last train home", s:"a slow one, tenor voice" },
  { t:"My grandmother's kitchen in summer", s:"warm, nostalgic, a bit funny" },
  { t:"Fuck this week", s:"loud, angry, no chorus rules" },
  { t:"Two people not saying the obvious thing", s:"quiet, soprano" }
];

function renderEmpty(){

function scrollDown(){ scroller.scrollTop = scroller.scrollHeight; }

function addUser(text){

  thread.appendChild(m); scrollDown();
}
function addBot(){

/* typing dots → streamed text */
function think(body, ms){
  const d = el('div','dots','<span></span><span></span><span></span>');
  body.appendChild(d);
  return new Promise(res=> setTimeout(()=>{ d.remove(); res(); }, ms));
}
function stream(body, text){
  return new Promise(res=>{
    const p = el('p'); body.appendChild(p);
    const words = text.split(' ');
    let i = 0;
    const caret = el('span','caret');
    p.appendChild(caret);
    const iv = setInterval(()=>{
      caret.insertAdjacentText('beforebegin', (i?' ':'') + words[i]);
      i++; scrollDown();
      if (i >= words.length){ clearInterval(iv); caret.remove(); res(p); }
    }, 22);
  });
}

/* ---------- the lyric sheet ---------- */
function renderSheet(song){
  const sheet = el('div','sheet');
  const head = el('div','sheet-head');
  head.innerHTML = `<b>${esc(song.title)}</b>`
    + (song.aggro ? '<span class="flag">EXPLICIT</span>' : '')
    + `<span class="meta">${esc(song.keyName)} · ${song.bpm} bpm · ${REGISTERS[song.register].name}</span>`;
  sheet.appendChild(head);
  const bodyEl = el('div','sheet-body');
  song.sections.forEach((sec, si)=>{
    bodyEl.appendChild(el('div','section-label', esc(sec.label)));
    sec.lines.forEach((text, li)=>{
      const line = el('div','line dim');
      line.dataset.key = si+'-'+li;
      syllabifyLine(text).forEach((syl,k)=>{
        const s = el('span','syl', esc(syl.txt));
        s.dataset.k = k;
        line.appendChild(s);
      });
      bodyEl.appendChild(line);
    });
  });
  sheet.appendChild(bodyEl);
  return sheet;
}

/* ---------- player ---------- */
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
function renderPlayer(song, sheet, id){
  const p = el('div','player');
  p.innerHTML = `
    <button class="pbtn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="${PLAY}"/></svg></button>
    <div class="pinfo">
      <b>${esc(song.title)}</b>
      <span class="meta">${esc(song.genre)} · ${esc(song.keyName)} · ${song.bpm} bpm · ${REGISTERS[song.register].name} vocal</span>
      <div class="bar"><i></i></div>
    </div>
    <canvas class="viz"></canvas>`;
  const btn = p.querySelector('.pbtn'), path = p.querySelector('path');
  const fill = p.querySelector('.bar i'), canvas = p.querySelector('canvas');
  const arr = arrange(song);
  let raf = null;

  function clearHighlight(){
    sheet.querySelectorAll('.line').forEach(l=>{ l.classList.remove('active'); l.classList.add('dim'); });
    sheet.querySelectorAll('.syl').forEach(s=>s.classList.remove('sung','now'));
  }
  let lastKey = null;
  function frame(){
    const t = Engine.elapsed();
    fill.style.width = Math.min(100, (t/arr.dur)*100) + '%';
    // karaoke
    arr.lines.forEach(line=>{
      const node = sheet.querySelector(`.line[data-key="${line.si}-${line.li}"]`);
      if (!node) return;
      const on = t >= line.t0 - 0.25 && t < line.t1;
      node.classList.toggle('active', on);
      node.classList.toggle('dim', !on);
      if (on){
        const key = line.si+'-'+line.li;
        if (key !== lastKey){ lastKey = key; node.scrollIntoView({block:'nearest'}); }
      }
      line.syls.forEach((syl,k)=>{
        const s = node.children[k]; if (!s) return;
        const now = t >= syl.t && t < syl.t + Math.max(syl.dur, 0.12);
        s.classList.toggle('now', now);
        s.classList.toggle('sung', !now && t >= syl.t && on);
      });
    });
    drawViz(canvas);
    raf = requestAnimationFrame(frame);
  }
  btn.onclick = ()=>{
    const started = Engine.play(id, arr, { onEnd(){
      path.setAttribute('d', PLAY);
      if (raf) cancelAnimationFrame(raf); raf=null;
      fill.style.width='0%'; clearHighlight(); drawViz(canvas);
    }});
    path.setAttribute('d', started ? PAUSE : PLAY);
    if (started){ if (raf) cancelAnimationFrame(raf); frame(); }
  };
  return { node:p, start(){ btn.click(); } };
}

function drawViz(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(rect.width*dpr)){
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr));
  }
  const c = canvas.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  const w = canvas.width/dpr, h = canvas.height/dpr;
  c.clearRect(0,0,w,h);
  const d = Engine.playing ? Engine.levels() : null;
  const css = getComputedStyle(document.documentElement);
  const bars = 12, bw = Math.max(1,(w - (bars-1)*2)/bars);
  for (let i=0;i<bars;i++){
    const v = d ? Math.pow(d[Math.floor(i*d.length/bars/2.4)]/255, 1.4) : 0.07;
    const bh = Math.max(2, v*h);
    c.fillStyle = (d ? css.getPropertyValue('--accent') : css.getPropertyValue('--line')).trim();
    c.globalAlpha = d ? 0.45+v*0.55 : 1;
    const x = i*(bw+2);
    c.beginPath();
    c.roundRect ? c.roundRect(x,(h-bh)/2,bw,bh,Math.min(bw/2,2)) : c.rect(x,(h-bh)/2,bw,bh);
    c.fill();
  }
  c.globalAlpha = 1;
}

/* ---------- follow-up edits ---------- */
function parseEdit(text){
  if (!lastSong) return null;
  const t = text.toLowerCase();
  const o = {}; let touched = false;
  if (/faster|quicker|speed (it )?up|more energy/.test(t)){ o.bpm = Math.min(190, Math.round(lastSong.bpm*1.22)); touched=true; }
  if (/slower|slow it down|calmer|softer/.test(t)){ o.bpm = Math.max(52, Math.round(lastSong.bpm*0.8)); touched=true; }
  if (/angrier|angry|harder|heavier|louder|meaner|aggressive/.test(t)){ o.mood='aggro'; touched=true; }
  if (/sadder|sad|darker|quieter|lonelier|melanchol/.test(t)){ o.mood='dark'; touched=true; }
  if (/happier|happy|brighter|lighter|warmer|nicer/.test(t)){ o.mood='bright'; touched=true; }
  ['soprano','alto','tenor','bass'].forEach(v=>{ if (t.includes(v)){ o.register=v; touched=true; } });
  if (/female|woman|higher voice/.test(t)){ o.register='soprano'; touched=true; }
  if (/male|man|deeper voice|lower voice/.test(t)){ o.register='bass'; touched=true; }
  if (/different lyrics|rewrite|new words|other words|try again|another version|again/.test(t)){ o.salt = String(Math.random()); touched=true; }
  return touched ? o : null;
}

/* ---------- history ---------- */
function addHistory(song, anchor){
  const hist = $('#hist');
  hist.querySelector('.empty')?.remove();
  const b = el('button', null, esc(song.title));
  b.onclick = ()=>{
    [...hist.children].forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    anchor.scrollIntoView({behavior:'smooth', block:'start'});
  };
  hist.prepend(b);
  [...hist.children].forEach(c=>c.classList.remove('on'));
  b.classList.add('on');
}

/* ---------- the main turn ---------- */
async function submit(text){
  text = (text||'').trim();
  if (!text) return;
  if (thread.querySelector('.empty-state')) thread.innerHTML = '';
  addUser(text);
  input.value = ''; input.style.height='auto'; sendBtn.disabled = true;

  const edit = parseEdit(text);
  const body = addBot();
  await think(body, 550 + Math.random()*400);

  let song, opener;
  if (edit){
    song = writeSong(lastSong.idea, Object.assign({salt:String(Math.random())}, edit));
    song.idea = lastSong.idea;
    const bits = [];
    if (edit.bpm) bits.push(edit.bpm > lastSong.bpm ? 'pushed the tempo up' : 'pulled the tempo back');
    if (edit.mood) bits.push('changed the mood to ' + edit.mood);
    if (edit.register) bits.push('moved it to a ' + edit.register);
    if (!bits.length) bits.push('rewrote the words');
    opener = `Done — ${bits.join(', ')}. Same idea, new take: a ${song.genre} in ${song.keyName} at ${song.bpm} bpm, ${REGISTERS[song.register].name} vocal. Here it is:`;
  } else {
    song = writeSong(text, {});
    opener = describe(song);
  }
  lastSong = song;

  await stream(body, opener);

  const sheet = renderSheet(song);
  body.appendChild(sheet);

  const id = 'song'+(++songCount);
  const actions = el('div','actions');
  const createBtn = el('button','create','▶ Create the song');
  const voiceSel = el('select','mini');
  ['auto','soprano','alto','tenor','bass'].forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v==='auto' ? 'Voice: '+REGISTERS[song.register].name : 'Voice: '+v;
    voiceSel.appendChild(o);
  });
  const againBtn = el('button','mini','↻ Different words');
  actions.append(createBtn, voiceSel, againBtn);
  body.appendChild(actions);
  scrollDown();

  createBtn.onclick = async ()=>{
    if (voiceSel.value !== 'auto') song.register = voiceSel.value;
    createBtn.disabled = true;
    createBtn.textContent = '● Composing…';
    await new Promise(r=>setTimeout(r, 700));
    createBtn.remove(); voiceSel.remove(); againBtn.remove();
    const player = renderPlayer(song, sheet, id);
    body.appendChild(player.node);
    scrollDown();
    player.start();
    addHistory(song, body.parentElement);
  };
  againBtn.onclick = ()=> submit('different lyrics, same idea');
}

/* ---------- composer wiring ---------- */
input.addEventListener('input', ()=>{
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  sendBtn.disabled = !input.value.trim();
});
input.addEventListener('keydown', e=>{
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(input.value); }
});
sendBtn.onclick = ()=> submit(input.value);
$('#newBtn').onclick = ()=>{ Engine.stop(); lastSong=null; renderEmpty(); };
$('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('hide');
if (window.innerWidth > 860) $('#sidebar').classList.remove('hide');
window.addEventListener('resize', ()=>{
  if (window.innerWidth > 860) $('#sidebar').classList.remove('hide');
});

renderEmpty();
</script>
