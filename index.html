<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse — the AI that writes songs and sings them</title>
<meta name="description" content="Tell Muse what the song should be about, in any of five languages. It writes the lyrics and sings them.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<style>
/* ============================================================
   Muse — chat interface
   ============================================================ */
:root{
  --bg:#ffffff; --side:#f9f9f9; --bubble:#f4f4f4;
  --ink:#0d0d0d; --ink-2:#5d5d5d; --ink-3:#8f8f8f;
  --line:#e5e5e5; --line-2:#ececec;
  --accent:#5b4be0; --accent-soft:#efedfd; --hot:#e5533c;
  --send:#0d0d0d; --send-ink:#ffffff;
  --font:"Söhne",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#212121; --side:#171717; --bubble:#303030;
    --ink:#ececec; --ink-2:#b4b4b4; --ink-3:#8f8f8f;
    --line:#333333; --line-2:#2a2a2a;
    --accent:#9d90ff; --accent-soft:#2b2740; --hot:#ff8a72;
    --send:#ffffff; --send-ink:#0d0d0d;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,select,textarea{font-family:inherit}
.app{display:flex;height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
.sidebar{
  width:260px;flex:none;background:var(--side);border-right:1px solid var(--line-2);
  display:flex;flex-direction:column;padding:10px;transition:margin-left .2s ease;
}
.brand{display:flex;align-items:center;gap:9px;padding:8px 8px 14px;font-weight:600;font-size:15px}
.brand .mark{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--hot));color:#fff;font-size:13px;
}
.newbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  font-size:14px;font-weight:500;cursor:pointer;text-align:left;
}
.newbtn:hover{background:var(--bubble)}
.hist-label{padding:18px 10px 6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.hist button{
  width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:transparent;
  color:var(--ink-2);font-size:14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hist button:hover,.hist button.on{background:var(--bubble);color:var(--ink)}
.hist .empty{padding:8px 10px;font-size:13px;color:var(--ink-3)}
.side-foot{border-top:1px solid var(--line-2);padding:10px 8px 4px;font-size:12.5px;color:var(--ink-3)}
.side-foot a{color:inherit}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line-2);font-size:14.5px;font-weight:600;
}
.topbar .model{color:var(--ink-2);font-weight:500}
.topbar .tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);
}
.topbar .spacer{flex:1}
.topbar select{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;font-weight:500;
}
.menu{display:none;background:none;border:0;color:var(--ink);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:768px;margin:0 auto;padding:26px 20px 40px}

/* ---------- empty state ---------- */
.empty-state{
  min-height:calc(100vh - 230px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:22px;padding:20px;
}
.empty-state h1{font-size:29px;font-weight:600;letter-spacing:-.01em;margin:0}
.empty-state p{margin:0;color:var(--ink-2);font-size:15px;max-width:470px}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
@media(max-width:640px){.seeds{grid-template-columns:1fr}}
.seed{
  text-align:left;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;font-size:14px;line-height:1.45;
}
.seed b{display:block;font-weight:600;margin-bottom:2px}
.seed span{color:var(--ink-3);font-size:13px}
.seed:hover{background:var(--bubble)}

/* ---------- messages ---------- */
.msg{display:flex;gap:14px;margin-bottom:26px}
.msg.user{justify-content:flex-end}
.msg.user .body{
  background:var(--bubble);padding:11px 16px;border-radius:20px;max-width:78%;
  white-space:pre-wrap;word-break:break-word;
}
.avatar{
  width:26px;height:26px;border-radius:50%;flex:none;margin-top:3px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--hot));color:#fff;font-size:12px;
}
.msg.bot .body{flex:1;min-width:0}
.msg.bot p{margin:0 0 12px}
.msg.bot p:last-child{margin-bottom:0}
.caret{display:inline-block;width:8px;height:16px;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.dots span{
  display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--ink-3);
  animation:bounce 1.2s infinite;
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* what the model understood */
.read{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.read span{
  font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);
}
.read span.plain{background:var(--bubble);color:var(--ink-2)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick button{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-size:13.5px;cursor:pointer;
}
.quick button:hover{background:var(--bubble)}

/* ---------- lyric sheet ---------- */
.sheet{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0 16px}
.sheet-head{
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;
  gap:10px;flex-wrap:wrap;background:var(--side);
}
.sheet-head b{font-size:15.5px;font-weight:600}
.sheet-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;
  background:var(--hot);color:#fff;
}
.sheet-body{padding:14px 16px}
.section-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  margin:12px 0 5px;text-transform:uppercase;
}
.section-label:first-child{margin-top:0}
.line{padding:1px 0;font-size:15.5px;line-height:1.75;border-radius:5px;transition:color .15s}
.line.dim{color:var(--ink-2)}
.line.active{color:var(--ink);font-weight:500}
.syl{transition:color .1s,background .1s;border-radius:4px;padding:0 .5px}
.syl.sung{color:var(--accent)}
.syl.now{background:var(--accent);color:#fff}

/* ---------- create + player ---------- */
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.create{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:0;
  background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;
}
.create:hover{filter:brightness(1.07)}
.create:disabled{opacity:.6;cursor:default}
.mini{
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink-2);font-size:13.5px;cursor:pointer;
}
.mini:hover{background:var(--bubble);color:var(--ink)}
select.mini{padding:8px 10px}
.player{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
  background:var(--side);border:1px solid var(--line);margin-top:14px;
}
.pbtn{
  width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:grid;place-items:center;cursor:pointer;
}
.pbtn svg{width:16px;height:16px;fill:currentColor}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.bar{height:4px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
canvas.viz{width:64px;height:34px;flex:none}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:0 20px 18px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.composer{
  max-width:768px;margin:0 auto;border:1px solid var(--line);border-radius:26px;
  background:var(--bg);padding:8px 8px 8px 18px;display:flex;align-items:flex-end;gap:8px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.composer:focus-within{border-color:var(--ink-3)}
.composer textarea{
  flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--ink);
  font-size:16px;line-height:1.5;max-height:180px;padding:9px 0;
}
.composer textarea::placeholder{color:var(--ink-3)}
.sendbtn{
  width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--send);color:var(--send-ink);
  display:grid;place-items:center;cursor:pointer;
}
.sendbtn:disabled{opacity:.28;cursor:default}
.sendbtn svg{width:17px;height:17px;fill:currentColor}
.disclaimer{max-width:768px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--ink-3)}

@media(max-width:860px){
  .sidebar{position:absolute;z-index:30;height:100%;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sidebar.hide{margin-left:-281px}
  .menu{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar hide" id="sidebar">
    <div class="brand"><span class="mark">♪</span> Muse</div>
    <button class="newbtn" id="newBtn">＋ New song</button>
    <div class="hist-label">Songs</div>
    <div class="hist" id="hist"><div class="empty">Nothing yet.</div></div>
    <div class="side-foot">Muse 0.6 · open source · <a href="https://github.com/your-username/muse">GitHub</a></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu" id="menuBtn" aria-label="Menu">☰</button>
      <span>Muse <span class="model">0.6</span></span>
      <span class="tag">WRITES · SINGS</span>
      <span class="spacer"></span>
      <select id="langSel" title="Language of the lyrics">
        <option value="auto" selected>Language: auto</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
      </select>
    </div>

    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="What should the song be about?"></textarea>
        <button class="sendbtn" id="send" disabled aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 4l7 7h-4.5v9h-5v-9H5z"/></svg>
        </button>
      </div>
      <div class="disclaimer">Muse writes the lyrics and sings them in your browser — five languages, no audio files, no server.</div>
    </div>
  </main>
</div>

<script>
/* ================================================================
   MUSE 0.6
   An AI that reads what you asked for, writes a song in one of five
   languages, and sings it with a formant voice — all in the browser.
   ================================================================ */

/* ---------------- 0 · utilities ---------------- */
function hashString(s){
  let h = 2166136261;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function makeRng(seed){
  let x = seed >>> 0;
  return function(){
    x = x + 0x6D2B79F5 | 0;
    let t = Math.imul(x ^ x >>> 15, 1 | x);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r,a) => a[Math.floor(r()*a.length)];
function shuffled(r,a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const setOf = s => new Set(s.split(' '));

/* ================================================================
   1 · LANGUAGES
   Each language brings its own stop-words, images, line templates and
   spelling rules. Images carry their own article and adjectives are
   invariable phrases, so the generated lines stay grammatical.
   ================================================================ */

const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* --- which language is this? --- */
function detectLang(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const score = {en:0, pt:0, es:0, fr:0, it:0};
  for (const [code,L] of Object.entries(LANGS)){
    L.hint.forEach(w=>{ if (t.includes(' '+w+' ')) score[code] += 2.5; });
    L.stop.forEach(w=>{ if (w.length>2 && t.includes(' '+w+' ')) score[code] += 1; });
  }
  if (/[ãõ]|ç[aou]|nh|lh|ções/.test(t)) score.pt += 5;
  if (/ñ|¿|¡|ll[aeiou]/.test(t))        score.es += 5;
  if (/œ|[êâîû]|\b[ldjmnst]'|qu'/.test(t)) score.fr += 4;
  if (/gli|gn[aeiou]|\bè\b|zione/.test(t)) score.it += 4;
  if (/[àáéíóúâô]/.test(t)) { score.pt += 1.5; score.es += 1; score.it += 1; score.fr += 1; }
  let best = 'en', bv = 0.9;                       // English unless something beats it
  for (const c in score) if (score[c] > bv){ bv = score[c]; best = c; }
  return best;
}

  tenor:/\b(tenor|t[eé]nor|tenore|male|masculin\w*|man singing|homem|hombre|homme|uomo)\b/i,
  bass:/\b(bass|baixo|bajo|basse|baritone|bar[ií]tono|deep voice|voz grave|low voice|monk)\b/i,
  noChorus:/\b(with\s+)?(no chorus|without a chorus|sem refr[ãa]o|sin estribillo|sans refrain|senza ritornello)\b/i,
  bridge:/\b(with|com|con|avec)?\s*(a|an|uma?|una?|une)?\s*(bridge|ponte|puente|middle eight)\b/i,
  short:/\b(short|curt[ao]|cort[ao]|court|breve|quick one)\b/i,
  instr:[[/\bpiano\b/i,'piano'],[/\b(guitar|guitarra|guitare|chitarra)\b/i,'guitar'],
         [/\b(drums|bateria|bater[ií]a|batterie|batteria|beat)\b/i,'drums'],
         [/\b(synth|sintetizador|synth[eé])\b/i,'synth'],
         [/\b(strings|cordas|cuerdas|cordes|archi|violin\w*)\b/i,'strings'],
         [/\b(fado|bossa|jazz|waltz|valsa|tango|blues|folk|punk|techno|house)\b/i,'$1']]
};
/* leading commands to peel off so the topic is just the topic */
const CMD = new RegExp('^\\s*(?:please\\s+|por favor\\s+|s\'il te pla[iî]t\\s+)?(?:' +
  'write|make|create|compose|sing|give me|do|escreve[r]?|faz(?:er)?|cria[r]?|canta[r]?|d[aá]-me|' +
  'escribe|haz|crea|canta|[eé]cris|fais|cr[eé]e|chante|scrivi|fai|crea|canta' +
  ')\\b[^,.:;]{0,40}?\\b(?:about|on|sobre|acerca de|de|sur|su|riguardo)\\b\\s*','i');

function parseIntent(text, prevLang){
  const raw = (text||'').trim();
  const t   = ' ' + raw.toLowerCase() + ' ';
  const st  = ' ' + strip(raw) + ' ';
  const out = { raw, asked:[] };
  const kill = [];                       // spans that are instructions, not subject matter
  const hit = (re, label)=>{
    const m = raw.match(re);
    if (!m) return null;
    kill.push(m[0]);
    if (label) out.asked.push(label);
    return m;
  };

  // language: explicit request wins, then detection
  for (const [re, code] of ASK.lang){
    if (hit(re, 'language')){ out.lang = code; break; }
  }
  if (!out.lang) out.lang = detectLang(raw);

  // tempo
  const bm = hit(ASK.bpmNum, 'bpm');
  if (bm) out.bpm = Math.max(45, Math.min(200, +bm[1]));
  else if (hit(ASK.fast, 'tempo')) out.tempo = 'fast';
  else if (hit(ASK.slow, 'tempo')) out.tempo = 'slow';

  // mood — the word is an instruction only when it isn't the subject itself
  if (hit(ASK.angry,'mood'))      out.mood = 'aggro';
  else if (hit(ASK.sad,'mood'))   out.mood = 'dark';
  else if (hit(ASK.happy,'mood')) out.mood = 'bright';

  // voice
  if (hit(ASK.soprano,'voice'))    out.register='soprano';
  else if (hit(ASK.alto,'voice'))  out.register='alto';
  else if (hit(ASK.tenor,'voice')) out.register='tenor';
  else if (hit(ASK.bass,'voice'))  out.register='bass';

  // shape
  if (hit(ASK.noChorus,'no chorus')) out.noChorus = true;
  if (hit(ASK.bridge,'bridge'))      out.wantBridge = true;
  if (hit(ASK.short,'short'))        out.short = true;

  // instruments / style
  out.instr = [];
  ASK.instr.forEach(([re,name])=>{
    const m = raw.match(re);
    if (m) out.instr.push(name === '$1' ? m[1].toLowerCase() : name);
  });
  if (out.instr.length) out.asked.push('instruments');

  // the topic: drop every instruction span, then the command, then the leftover style clause
  let topic = raw;
  kill.forEach(k=>{ topic = topic.split(k).join(' '); });
  topic = topic.replace(CMD,'')
               .replace(/^\s*(?:a|an|the|uma?|una?|une)?\s*(?:song|c[aâ]n[cç][aã]o|canci[oó]n|chanson|canzone)\s*(?:about|on|sobre|acerca de|sur|su|de|di)\s*/i,'')
               .replace(/\s*,\s*,\s*/g,', ').replace(/\s{2,}/g,' ')
               .replace(/^[\s,;–—-]+|[\s,;–—-]+$/g,'')
               .replace(/\b(with|com|con|avec|and|e|y|et)\s*(a|an|uma?|una?|une)?\s*$/i,'')
               .replace(/^[\s,;–—-]+|[\s,;–—-]+$/g,'');
  const parts = topic.split(/[,;—–]| - /).map(s=>s.trim()).filter(Boolean);
  if (parts.length > 1){
    const styleOnly = s => {
      const w = strip(s).split(/\s+/).filter(Boolean);
      const styleRe = /^(fast|slow|sad|happy|angry|loud|quiet|soft|calm|warm|dark|bright|soprano|alto|tenor|bass|piano|guitar|drums|synth|strings|short|long|male|female|no|without|chorus|bridge|bpm|\d+|rapido|lento|triste|feliz|alegre|zangado|raiva|calmo|curta|curto|voz|aguda|grave|guitarra|bateria|cordas|sem|refrao|com|ponte|en|em|in|de|the|a|an|one|nice|good|please)$/;
      return w.length > 0 && w.every(x => styleRe.test(x));
    };
    const kept = parts.filter(p => !styleOnly(p));
    topic = (kept.length ? kept : parts).join(', ');
  }
  topic = topic.replace(/^(that|which|it)\s+/i,'').trim();
  out.topic = topic || raw;

  // is there actually an idea here?
  const L = LANGS[out.lang];
  const content = strip(out.topic).split(/\s+/).filter(w => w.length>2 && !L.stop.has(w));
  out.contentWords = content.length;
  out.thin = content.length < 2 && !out.asked.length;
  return out;
}

/* ================================================================
   3 · THE SONGWRITER
   Fill templates with the user's own phrases, then choose the four
   lines of each section so that they rhyme and scan together.
   ================================================================ */
const MOODW = {
  dark:['rain','sad','night','lonely','alone','grief','winter','fog','ghost','empty','cold','blue','miss','missing','goodbye','leaving','lost','tired','regret','last','funeral','chuva','triste','noite','sozinho','saudade','perdi','adeus','frio','falta','ausencia','despedida','luto','lluvia','solo','noche','perdido','pluie','nuit','seul','perdu','pioggia','notte','solo','perso'],
  bright:['sun','happy','summer','dance','bright','joy','beach','party','morning','sunrise','warm','gold','love','wedding','friends','home','birthday','free','laugh','sol','feliz','verao','verano','danca','manha','amor','casamento','amigos','festa','ete','soleil','heureux','estate','sole','felice','allegro'],
  aggro:['angry','rage','furious','hate','scream','loud','riot','fight','wasted','revenge','burn','sick','done','fuck','shit','damn','hell','raiva','zangado','farto','gritar','partir','odio','vingança','vinganca','rabia','gritos','colere','rabbia','urlare']
};
function moodFrom(text, r){
  const t = ' ' + strip(text) + ' ';
  const hit = m => MOODW[m].some(w => t.includes(' '+w) );
  if (hit('aggro')) return 'aggro';
  if (hit('dark'))  return 'dark';
  if (hit('bright'))return 'bright';
  return r() < 0.55 ? 'dark' : 'bright';
}

/* content words and adjacent pairs from what the user wrote */
function harvest(text, L){
  const toks = text.toLowerCase().replace(/[^\p{L}\p{N}\s'’-]/gu,' ').split(/\s+/).filter(Boolean);
  const words = [], phrases = [];
  let run = [];
  const flush = ()=>{ for (let i=0;i<run.length-1;i++) phrases.push(run[i]+' '+run[i+1]); words.push(...run); run=[]; };
  toks.forEach(w=>{ if (w.length>2 && !L.stop.has(w) && !L.stop.has(strip(w))) run.push(w); else flush(); });
  flush();
  const VERBY = setOf("goes went come came comes keep keeps say says said get gets got give gave take took put make made does did was were are is vai foi vem tem faz diz era son fue est sono");
  return {
    words:[...new Set(words)],
    phrases:[...new Set(phrases)].filter(p=>!VERBY.has(p.split(' ')[0])).slice(0,6)
  };
}

/* rhyme = from the last stressed-ish vowel of the last word to the end */
function rhymeKey(line){
  const w = strip(line).replace(/[^a-z\s]/g,'').trim().split(/\s+/).pop() || '';
  const m = w.match(/[aeiou][a-z]*$/);
  if (!m) return w.slice(-2);
  let k = m[0];
  if (k.length > 4) k = k.slice(-4);
  return k.replace(/s$/,'');                    // sing/sings still rhyme
}
const countSyl = s => (strip(s).match(/[aeiou]+/g) || []).length;

function writeSong(intent, opts){
  opts = opts || {};
  const idea = intent.topic || intent.raw;
  const lang = opts.lang || intent.lang || 'en';
  const L    = LANGS[lang];
  const seed = hashString(strip(idea) + lang + (opts.salt||''));
  const r    = makeRng(seed);

  const mood = opts.mood || intent.mood || moodFrom(intent.raw, r);
  const bank = L.bank[mood];
  const { words, phrases } = harvest(idea, L);

  const ADJ_ONLY = setOf("last first next big small old new good bad real whole only best worst same different hard easy long short late early own ultimo primeiro grande pequeno velho novo mesmo");
  const nouns = words.filter(w => !/ing$|ed$|ly$/.test(w) && !ADJ_ONLY.has(strip(w))).map(w=>w.replace(/['’]s$/,''));
  const gerunds = words.filter(w => /ing$/.test(w) && w.length > 4);
  const kwPool = [...phrases, ...nouns, ...words].filter((v,i,a)=>v && a.indexOf(v)===i);
  const fallback = {en:['the night','the light','your name'], pt:['a noite','a luz','o teu nome'],
                    es:['la noche','la luz','tu nombre'], fr:['la nuit','la lumière','ton nom'],
                    it:['la notte','la luce','il tuo nome']}[lang];
  if (!kwPool.length) kwPool.push(...fallback);
  const gerundish = phrases.filter(p => /ing$/.test(p.split(' ')[0]) && p.includes(' '));

  /* English wants a determiner where the romance templates don't:
     "I lost the last train", not "I lost last train" */
  const proper = new Set((idea.match(/(?!^)\b[A-Z][\p{L}]+/gu)||[]).map(w=>w.toLowerCase()));
  const DET = /^(the|a|an|my|your|his|her|our|their|this|that|some)\b/i;
  const theify = k => (lang !== 'en' || DET.test(k) || /^\w+ing\b/.test(k)
                       || proper.has(k.split(' ')[0].toLowerCase())) ? k : 'the ' + k;

  let kwCursor = 0;
  function fill(tpl){
    let usedImg = null;
    let s = tpl
      .replace(/\{kw\}/g,  ()=> theify(kwPool[(kwCursor++) % kwPool.length]))
      .replace(/\{img\}/g, ()=>{ let v, n=0; do { v = pick(r, bank.img); n++; } while (v===usedImg && n<4); usedImg=v; return v; })
      .replace(/\{adj\}/g, ()=> pick(r, bank.adj))
      .replace(/\{verb\}/g,()=> pick(r, bank.verb))
      .replace(/\{ing\}/g, ()=> (gerunds.length && r()<0.5) ? pick(r, gerunds) : pick(r, bank.ing));
    gerundish.forEach(g=>{
      s = s.replace(new RegExp('\\b(the|a) '+g.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), g);
    });
    if (lang === 'en') s = s.replace(/\ba (?=(?:[aeiou]|honest|hour))/gi, m => m[0]==='A' ? 'An ' : 'an ');
    return s.replace(/\s{2,}/g,' ').trim().replace(/^./, c=>c.toUpperCase());
  }

  /* build a quatrain whose 2nd and 4th lines rhyme and whose lines scan alike */
  function quatrain(pool, n, exclude){
    n = n || 4;
    exclude = exclude || new Set();
    // two fills per template, but a template may only appear once in a section
    const cand = [];
    shuffled(r, pool.map((tpl,i)=>({tpl,i}))).forEach(({tpl,i})=>{
      if (exclude.has(i)) return;                       // don't repeat a line shape across sections
      for (let k=0;k<2;k++){
        const text = fill(tpl);
        if (!cand.some(c=>c.text===text)) cand.push({ tpl:i, text, rhyme:rhymeKey(text), syl:countSyl(text) });
      }
    });
    if (cand.length < n){
      const all = pool.map((tpl,i)=>({tpl:i, text:fill(tpl)}));
      return { lines: all.slice(0,n).map(c=>c.text), used: all.slice(0,n).map(c=>c.tpl) };
    }

    let best = null, bestScore = -1e9;
    for (let a=0; a<cand.length; a++){
      for (let b=0; b<cand.length; b++){
        if (cand[b].tpl === cand[a].tpl) continue;
        for (let d=0; d<cand.length; d++){
          if (cand[d].tpl===cand[a].tpl || cand[d].tpl===cand[b].tpl) continue;
          const rhymed = cand[b].rhyme === cand[d].rhyme;          // ABCB, the workhorse of song lyrics
          for (let c=0; c<cand.length && c<10; c++){
            if (cand[c].tpl===cand[a].tpl||cand[c].tpl===cand[b].tpl||cand[c].tpl===cand[d].tpl) continue;
            const set = [cand[a],cand[b],cand[c],cand[d]];
            const syls = set.map(x=>x.syl);
            const spread = Math.max(...syls) - Math.min(...syls);
            const score = (rhymed ? 60 : 0)
                        + (cand[a].rhyme === cand[c].rhyme ? 18 : 0)   // ABAB is a bonus
                        - spread * 3.5
                        - (syls.some(s=>s>14) ? 8 : 0);
            if (score > bestScore){ bestScore = score; best = set; }
          }
        }
      }
      if (bestScore >= 74) break;                                   // good enough, stop searching
    }
    const chosen = (best || cand.slice(0,n)).slice(0,n);
    return { lines: chosen.map(c=>c.text), used: chosen.map(c=>c.tpl) };
  }

  const q1 = quatrain(L.verse[mood]);
  const q2 = quatrain(L.verse[mood], 4, new Set(q1.used));
  const qc = quatrain(L.chorus[mood]);
  const qb = quatrain(L.bridge[mood], Math.min(3, L.bridge[mood].length));
  const verse1 = q1.lines, verse2 = q2.lines, chorus = qc.lines, bridge = qb.lines;

  // --- musical decisions ---
  const keys = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const root = 48 + Math.floor(r()*10);
  let bpm = mood==='aggro' ? Math.round(138+r()*22)
          : mood==='bright'? Math.round(96+r()*24)
          : Math.round(68+r()*20);
  if (intent.tempo === 'slow') bpm = Math.round(56+r()*14);
  if (intent.tempo === 'fast') bpm = Math.round(126+r()*26);
  if (intent.bpm) bpm = intent.bpm;
  if (opts.bpm)   bpm = opts.bpm;

  const scale = mood==='aggro' ? 'minorPent'
              : mood==='dark'  ? (r()<0.5 ? 'minorPent' : 'aeolian')
              : (r()<0.5 ? 'majorPent' : 'lydian');
  const register = opts.register || intent.register ||
    (mood==='aggro' ? 'tenor' : (r()<0.5 ? 'alto' : 'tenor'));

  // --- structure ---
  const sec = (label, lines) => ({label, lines});
  const CH = {en:'Chorus',pt:'Refrão',es:'Estribillo',fr:'Refrain',it:'Ritornello'}[lang];
  const V  = {en:'Verse',pt:'Verso',es:'Estrofa',fr:'Couplet',it:'Strofa'}[lang];
  const BR = {en:'Bridge',pt:'Ponte',es:'Puente',fr:'Pont',it:'Ponte'}[lang];
  let sections;
  if (intent.noChorus){
    sections = [sec(V+' 1', verse1), sec(V+' 2', verse2), sec(BR, bridge)];
  } else if (intent.short){
    sections = [sec(V+' 1', verse1), sec(CH, chorus)];
  } else {
    sections = [sec(V+' 1', verse1), sec(CH, chorus), sec(V+' 2', verse2), sec(CH, chorus)];
    if (intent.wantBridge || r() < 0.55){ sections.push(sec(BR, bridge), sec(CH, chorus)); }
  }

  const genre = intent.instr && intent.instr.length && /fado|bossa|jazz|waltz|valsa|tango|blues|folk|punk|techno|house/.test(intent.instr.join(' '))
    ? intent.instr.find(i=>/fado|bossa|jazz|waltz|valsa|tango|blues|folk|punk|techno|house/.test(i))
    : pick(r, L.genre[mood]);

  return {
    idea, lang, seed, mood, title:titleFromIdea(idea, lang),
    bpm, scale, root, register, genre, sections,
    hook: (chorus[0] || verse1[0]),
    keyName: keys[root%12] + (['minorPent','aeolian'].includes(scale)
      ? {en:' minor',pt:' menor',es:' menor',fr:' mineur',it:' minore'}[lang]
      : {en:' major',pt:' maior',es:' mayor',fr:' majeur',it:' maggiore'}[lang]),
    explicit: /\b(fuck|shit|bitch|puta|merda|foda|mierda|merde|cazzo)\w*\b/i.test(idea),
    instr: intent.instr || []
  };
}

function titleFromIdea(text, lang){
  const small = LANGS[lang].small;
  let w = (text||'').split(/[,—–;]|\bthat\b|\bque\b/)[0]
    .replace(/[^\p{L}\p{N}\s'’]/gu,' ').split(/\s+/).filter(Boolean);
  while (w.length && small.has(strip(w[0]))) w.shift();
  w = w.slice(0,4);
  while (w.length > 1 && small.has(strip(w[w.length-1]))) w.pop();
  if (!w.length) return {en:'Untitled',pt:'Sem título',es:'Sin título',fr:'Sans titre',it:'Senza titolo'}[lang];
  return w.map((x,i)=>{
    const lx = x.toLowerCase();
    return (i>0 && small.has(strip(lx))) ? lx : lx.charAt(0).toUpperCase()+lx.slice(1);
  }).join(' ');
}

function describe(song){
  const L = LANGS[song.lang], s = L.say;
  return s.make(song.genre, song.keyName, song.bpm, L.voices[song.register]) + ' '
       + s.about(song.idea.replace(/\.$/,''), s.feel[song.mood], song.hook) + ' '
       + s.words;
}

/* ---- per-language spelling ---- */
const VLET = {

  pt:'aeiouyáàâãéêíóôõúü',

  fr:'aeiouyàâéèêëîïôùûü',

const DIGR = {
  en:['sh','ch','th','ng','ph','ck','qu','wh','gh'],
  pt:['nh','lh','ch','rr','ss','qu','gu','ç'],
  es:['ll','ch','rr','qu','gu','ñ'],
  fr:['ch','gn','qu','ph','ill','eau','ou','oi','au','ai','ei','eu'],
  it:['gli','gn','sci','sce','chi','che','ghi','ghe','ci','ce','gi','ge','qu']

function consKey(tok, lang, next){
  const n = (next||'')[0] || '';
  if (lang==='pt'){
    if (tok==='nh') return 'ny'; if (tok==='lh') return 'ly';
    if (tok==='ch') return 'sh'; if (tok==='ç') return 's';
    if (tok==='j')  return 'zh'; if (tok==='g' && /[ei]/.test(n)) return 'zh';
    if (tok==='rr'||tok==='r') return 'r';
    if (tok==='x')  return 'sh'; if (tok==='qu') return 'k'; if (tok==='gu') return 'g';
    if (tok==='ss') return 's';
  }
  if (lang==='es'){
    if (tok==='ll') return 'y'; if (tok==='ñ') return 'ny';
    if (tok==='j')  return 'h'; if (tok==='g' && /[ei]/.test(n)) return 'h';
    if (tok==='z')  return 's'; if (tok==='c' && /[ei]/.test(n)) return 's';
    if (tok==='h')  return '';  if (tok==='v') return 'b';
    if (tok==='qu') return 'k'; if (tok==='gu') return 'g'; if (tok==='ch') return 'ch';
  }
  if (lang==='fr'){
    if (tok==='ch') return 'sh'; if (tok==='gn') return 'ny';
    if (tok==='j')  return 'zh'; if (tok==='g' && /[eiy]/.test(n)) return 'zh';
    if (tok==='c' && /[eiy]/.test(n)) return 's'; if (tok==='ç') return 's';
    if (tok==='qu') return 'k';  if (tok==='h') return '';
    if (tok==='ill')return 'y';  if (tok==='r') return 'r';
  }
  if (lang==='it'){
    if (tok==='gli')return 'ly'; if (tok==='gn') return 'ny';
    if (tok==='sci'||tok==='sce') return 'sh';
    if (tok==='ci' ||tok==='ce')  return 'ch';
    if (tok==='gi' ||tok==='ge')  return 'j';
    if (tok==='chi'||tok==='che'||tok==='ghi'||tok==='ghe') return 'k';
    if (tok==='z')  return 'ts'; if (tok==='h') return ''; if (tok==='qu') return 'kw';
    if (tok==='c')  return 'k';  if (tok==='g') return 'g';
  }
  // english + shared
  const base = {c:/[eiy]/.test(n)?'s':'k', q:'k', x:'ks', ph:'f', ck:'k', wh:'w', gh:'',
                qu:'kw', g:/[eiy]/.test(n)?'j':'g', y:'y', ç:'s', ñ:'ny', ll:'l'};
  return (base[tok] !== undefined) ? base[tok] : (CONS[tok] ? tok : '');
}
/* the vowel run of a syllable → a vowel or diphthong key */
function vowelKey(run, lang, coda, isFinal, isFirst, silE){
  const v = strip(run);
  const nasalizing = coda && /^[mn]/.test(coda[0]||'');
  if (lang==='pt'){
    if (/ão|ãe/.test(run)) return 'ao';
    if (/ã|â/.test(run) || (nasalizing && /^a/.test(v))) return 'an';
    if (/õ/.test(run) || (nasalizing && /^o/.test(v))) return 'on';
    if (nasalizing && /^[ei]/.test(v)) return 'in';
    if (/^ou/.test(v)) return 'o';   if (/^ei/.test(v)) return 'ei';
    if (/^eu/.test(v)) return 'eu';  if (/^ai/.test(v)) return 'ai';
    if (/^au/.test(v)) return 'au';  if (/^oi/.test(v)) return 'oi';
    if (/^ia/.test(v)) return 'ia';  if (/^io/.test(v)) return 'io';
    if (/^[áa]/.test(v)) return 'a'; if (/^[éê]/.test(v)) return 'e';
    if (/^oa/.test(v)) return 'oa';
    if (/^e/.test(v))  return (isFinal && !isFirst && v==='e') ? 'schwa' : 'e';
    if (/^i/.test(v))  return 'ee';  if (/^[óô]/.test(v)) return 'o';
    if (/^o/.test(v))  return (isFinal && !isFirst && v==='o') ? 'oo' : 'o';
    if (/^u/.test(v))  return 'oo';
    return 'a';
  }
  if (lang==='es' || lang==='it'){
    if (/^ie/.test(v)) return 'ea';  if (/^ia/.test(v)) return 'ia';
    if (/^io/.test(v)) return 'io';  if (/^ue/.test(v)) return 'e';
    if (/^ai/.test(v)) return 'ai';  if (/^ei/.test(v)) return 'ei';
    if (/^oi/.test(v)) return 'oi';  if (/^au/.test(v)) return 'au';
    if (/^a/.test(v)) return 'a';    if (/^e/.test(v)) return 'e';
    if (/^i/.test(v)) return 'ee';   if (/^o/.test(v)) return 'o';
    if (/^u/.test(v)) return 'oo';
    return 'a';
  }
  if (lang==='fr'){
    if (nasalizing && /^(a|e)/.test(v)) return 'an';
    if (nasalizing && /^o/.test(v))     return 'on';
    if (nasalizing && /^(i|u|y)/.test(v))return 'in';
    if (/^eau|^au/.test(v)) return 'o'; if (/^ou/.test(v)) return 'oo';
    if (/^oi/.test(v))  return 'wa';    if (/^eu|^oeu/.test(v)) return 'eu';
    if (/^ai|^ei/.test(v)) return 'e';  if (/^u/.test(v)) return 'y';
    if (/^é|^è|^ê|^e/.test(run) || /^e/.test(v)) return isFinal && !isFirst && !/[éèê]/.test(run) ? 'schwa' : 'e';
    if (/^a/.test(v)) return 'a';       if (/^i|^y/.test(v)) return 'ee';
    if (/^o/.test(v)) return 'o';
    return 'schwa';
  }
  // english
  const silentE = !!silE;
  if (/^igh/.test(v)) return 'ai';
  if (/^(ee|ea|ie|ey)/.test(v)) return 'ee';
  if (/^oo/.test(v))  return 'oo';
  if (/^(ou|ow)/.test(v)) return 'au';
  if (/^(oi|oy)/.test(v)) return 'oi';
  if (/^(ai|ay)/.test(v)) return 'ei';
  if (/^(au|aw)/.test(v)) return 'o';
  if (silentE){
    if (/^a/.test(v)) return 'ei';  if (/^i/.test(v)) return 'ai';
    if (/^o/.test(v)) return 'ou';  if (/^u/.test(v)) return 'ju';
    if (/^e/.test(v)) return 'ee';
  }
  const openEnd = !coda || !coda.length;
  if (/^a/.test(v)) return openEnd && !isFirst ? 'schwa' : 'ae';
  if (/^e/.test(v)) return openEnd && !isFirst ? 'schwa' : 'e';
  if (/^i|^y/.test(v)) return openEnd && !isFirst ? 'ee' : 'ih';
  if (/^o/.test(v)) return openEnd ? 'ou' : 'o';
  if (/^u/.test(v)) return 'uh';
  return 'schwa';
}

/* English spelling lies more than the others; these are the lies that
   show up most in lyrics, so they get looked up instead of guessed */
const EN_EXC = {
  love:'uh', come:'uh', some:'uh', done:'uh', none:'uh', one:'uh', above:'uh', glove:'uh',
  of:'uh', from:'uh', what:'uh', does:'uh', was:'uh', us:'uh', just:'uh', nothing:'uh',
  move:'oo', lose:'oo', prove:'oo', do:'oo', to:'oo', who:'oo', through:'oo', you:'oo', two:'oo',
  gone:'o', want:'o', water:'o', all:'o', call:'o', fall:'o', small:'o',
  have:'ae', give:'ih', live:'ih', said:'e', again:'e', many:'e', any:'e', friend:'e', dead:'e',
  heart:'a', are:'a', far:'a', car:'a', dark:'a',
  word:'schwa', work:'schwa', world:'schwa', earth:'schwa', the:'schwa', a:'schwa',
  eye:'ai', eyes:'ai', buy:'ai', bye:'ai', why:'ai', my:'ai', by:'ai', try:'ai', cry:'ai', sky:'ai',
  night:'ai', light:'ai', right:'ai', might:'ai', sight:'ai', fight:'ai', tight:'ai',
  door:'o', floor:'o', more:'o', before:'o', your:'o', four:'o'
};

/* letters → {onset, nuc, coda} for one syllable */
function g2p(sylRaw, lang, isFirst, isFinal){
  const letters = VLET[lang], isV = c => letters.includes(c);
  let s = (sylRaw||'').toLowerCase().replace(/[^\p{L}']/gu,'');
  if (!s) return {onset:[], nuc:'schwa', coda:[]};
  const digr = DIGR[lang];
  const toks = [];
  for (let i=0;i<s.length;i++){
    let hit = null;
    for (const d of digr){ if (s.substr(i, d.length) === d){ hit = d; break; } }
    if (hit && hit.length > 1 && !isV(hit[0])){
      toks.push(hit); i += hit.length-1;
      if (lang==='it' && /^(ci|ce|gi|ge|sci|sce|chi|che|ghi|ghe)$/.test(hit)) toks.push(hit.slice(-1));
      continue;
    }
    toks.push(s[i]);
  }
  const vAt = toks.findIndex(t => t.length===1 && isV(t));
  if (vAt < 0){
    const on = toks.map((t,i)=>consKey(t, lang, toks[i+1])).filter(c=>CONS[c]);
    return { onset:on.slice(-2), nuc:'schwa', coda:[], voiceless:true };
  }
  let vEnd = vAt;
  while (vEnd+1 < toks.length && toks[vEnd+1].length===1 && isV(toks[vEnd+1])) vEnd++;
  const run   = toks.slice(vAt, vEnd+1).join('');
  const onset = toks.slice(0, vAt).map((t,i)=>consKey(t, lang, toks[i+1])).filter(c=>CONS[c]).slice(-2);
  let codaT   = toks.slice(vEnd+1);
  let coda    = codaT.map((t,i)=>consKey(t, lang, codaT[i+1])).filter(c=>CONS[c]);
  const silE  = codaT.length > 0 && codaT[codaT.length-1] === 'e';   // "home", "name", "time"
  let   nuc   = vowelKey(run, lang, coda, isFinal, isFirst, silE);
  if (lang === 'en'){
    const key = s.replace(/[^a-z]/g,'');
    if (EN_EXC[key]) nuc = EN_EXC[key];
    else if (/igh/.test(key)) nuc = 'ai';
    else if (silE && /^y/.test(strip(run))) nuc = 'ai';
  }
  if (NASAL.has(nuc)) coda = coda.filter(c => c!=='m' && c!=='n');   // absorbed into the vowel
  if (lang==='fr' && isFinal) coda = coda.filter(c => 'crfl'.includes(c[0]));  // silent final consonants
  if (lang==='pt' && isFinal) coda = coda.map(c => c==='s' ? 'sh' : c);        // European Portuguese
  return { onset, nuc, coda: coda.slice(0,2) };
}

/* ---- syllable splitting ---- */
function splitSyl(word, lang){
  const letters = VLET[lang], isV = c => letters.includes(c);
  const c=[...word.toLowerCase()], parts=[]; let cur='';
  for (let i=0;i<c.length;i++){
    cur += c[i];
    if (isV(c[i])){
      while (i+1<c.length && isV(c[i+1])) cur += c[++i];
      if (i+2<c.length && !isV(c[i+1]) && isV(c[i+2])){ parts.push(cur); cur=''; }
      else if (i+3<c.length && !isV(c[i+1]) && !isV(c[i+2]) && isV(c[i+3])){ cur += c[++i]; parts.push(cur); cur=''; }
      else if (i+4<c.length && !isV(c[i+1]) && !isV(c[i+2]) && !isV(c[i+3]) && isV(c[i+4])){ cur += c[++i]; parts.push(cur); cur=''; }
    }
  }
  if (cur){
    if (parts.length && ![...cur].some(isV)) parts[parts.length-1] += cur;
    else parts.push(cur);
  }
  const KEEP_E = new Set(['maybe','recipe','karate','finale','simile','sesame','apostrophe','epitome','cafe','latte']);
  if (lang==='en' && parts.length>1 && /^[bcdfghjklmnpqrstvwxz]+e$/.test(parts[parts.length-1]) && !KEEP_E.has(word)){
    const tail = parts.pop(); parts[parts.length-1] += tail;
  }
  return parts.length ? parts : [word];
}

/* a line → sung syllables, keeping the original spelling for the karaoke */
function syllabifyLine(text, lang){
  lang = lang || 'en';
  const out = [];
  text.split(/(\s+)/).forEach(tok=>{
    if (!tok) return;
    if (/^\s+$/.test(tok)){ if (out.length) out[out.length-1].txt += tok; return; }
    const m = tok.match(/^([^\p{L}]*)([\p{L}'’-]+)([^\p{L}]*)$/u);
    if (!m){ if (out.length) out[out.length-1].txt += tok; else out.push({txt:tok, nuc:'schwa', onset:[], coda:[]}); return; }
    const [, pre, core, post] = m;
    const parts = splitSyl(core, lang);
    let cursor = 0;
    parts.forEach((p,i)=>{
      const raw = core.substr(cursor, p.length); cursor += p.length;
      const ph = g2p(p, lang, i===0, i===parts.length-1);
      out.push({ txt:(i===0?pre:'') + raw + (i===parts.length-1?post:''),
                 nuc:ph.nuc, onset:ph.onset, coda:ph.coda,
                 word:core.toLowerCase(), first:i===0, lastOfWord:i===parts.length-1 });
    });
  });
  return out;
}
/* ================================================================
   5 · ARRANGEMENT
   ================================================================ */
const SCALES = {
  minorPent:[0,3,5,7,10], majorPent:[0,2,4,7,9],
  aeolian:[0,2,3,5,7,8,10], lydian:[0,2,4,6,7,9,11]
};
const REGISTERS = {
  soprano:{shift:1.26, oct:26, name:'soprano'},
  alto:   {shift:1.11, oct:21, name:'alto'},
  tenor:  {shift:1.00, oct:14, name:'tenor'},
  bass:   {shift:0.86, oct:7,  name:'bass'}
};
const mtof = m => 440*Math.pow(2,(m-69)/12);
function scaleNote(root, sc, deg){
  const oct = Math.floor(deg/sc.length);
  return root + sc[((deg%sc.length)+sc.length)%sc.length] + 12*oct;
}

function arrange(song){
  const sc   = SCALES[song.scale];
  const beat = 60/song.bpm, step = beat/2, barD = beat*4;
  const reg  = REGISTERS[song.register] || REGISTERS.alto;
  const r    = makeRng(song.seed ^ 0x9e3779b9);
  const INTRO = 2, LINE_BARS = 2, OUTRO = 2;
  const inst = (song.instr||[]).join(' ');
  const padType  = /string|cordas|cuerdas|cordes|archi/.test(inst) ? 'sawtooth' : 'triangle';
  const leadType = /guitar|guitarra|chitarra|punk|rock/.test(inst) || song.mood==='aggro' ? 'square' : 'triangle';
  const quiet    = /piano|folk|fado|ambient|bossa/.test(inst);

  const plan = [];
  for (let i=0;i<INTRO;i++) plan.push({kind:'intro'});
  song.sections.forEach((sec, si)=>{
    const chorus = /chorus|refr|estribillo|refrain|ritornello/i.test(sec.label);
    sec.lines.forEach((text, li)=>{
      plan.push({kind:'line', si, li, text, chorus});
      plan.push({kind:'hold', chorus});
    });
  });
  for (let i=0;i<OUTRO;i++) plan.push({kind:'outro'});

  const events = [], lines = [];
  const vibDepth = song.mood==='aggro' ? 0.008 : 0.016;
  const vibRate  = song.mood==='aggro' ? 6.2 : 5.2 + r()*0.6;

  plan.forEach((bar, b)=>{
    const t0  = b*barD;
    const deg = (bar.chorus ? [3,4,0,5] : [0,5,3,4])[b % 4];
    const chordRoot = scaleNote(song.root, sc, deg);
    const full = bar.kind==='line' || bar.kind==='hold';

    [0,2,4].forEach((k,n)=>{
      events.push({t:t0, kind:'tone', f:mtof(scaleNote(chordRoot, sc, deg+k)+(n===2?12:0)),
                   dur:barD*0.96, type:padType, gain:0.045, filt:1700});
    });
    events.push({t:t0,        kind:'tone', f:mtof(chordRoot-12), dur:beat*1.6, type:'sawtooth', gain:0.14, filt:300});
    events.push({t:t0+beat*2, kind:'tone', f:mtof(chordRoot-12), dur:beat*1.6, type:'sawtooth', gain:0.12, filt:300});

    if ((full || bar.kind==='outro') && !quiet){
      for (let s=0;s<8;s++){
        const t = t0+s*step;
        if (s%2===1) events.push({t, kind:'noise', dur:0.06, gain:song.mood==='aggro'?0.07:0.04});
        if (s===0||s===4) events.push({t, kind:'tone', f:70, dur:0.17, type:'sine', gain:song.mood==='aggro'?0.32:0.24, filt:200});
        if ((song.mood==='aggro'||bar.chorus) && (s===2||s===6)) events.push({t, kind:'noise', dur:0.2, gain:0.09});
      }
    }
    if (!full){
      for (let s=0;s<8;s+=2) if (r()<0.7){
        events.push({t:t0+s*step, kind:'tone', f:mtof(scaleNote(song.root+12, sc, deg+Math.floor(r()*5))),
                     dur:step*1.6, type:leadType, gain:0.09, filt:4000});
      }
    }

    /* ---- the sung line: one continuous phrase ---- */
    if (bar.kind === 'line'){
      const syls = syllabifyLine(bar.text, song.lang);
      const n = syls.length;
      const span = LINE_BARS*8;
      const unit = n > 12 ? span/(n+2) : 1;
      const base = deg + (bar.chorus ? 4 : 0);
      let walk = 0;
      const notes = [], lineSyls = [];
      syls.forEach((syl, k)=>{
        const last = k === n-1;
        const t = t0 + (1 + k*unit)*step;
        const dur = step * (last ? Math.max(2.4, unit*3.2) : unit*0.98);
        // a singable line: mostly stepwise, occasional leap, resolve at the end
        const roll = r();
        walk += roll<0.34 ? 0 : roll<0.72 ? (r()<0.5?1:-1) : (r()<0.5?2:-2);
        walk = Math.max(-2, Math.min(7, walk));
        if (last) walk = [0,2,4].reduce((a,c)=>Math.abs(c-walk)<Math.abs(a-walk)?c:a, 0);
        const f = mtof(scaleNote(song.root + reg.oct - 12, sc, base + walk));
        notes.push({t, dur, f, syl});
        lineSyls.push({txt:syl.txt, t, dur});
      });
      events.push({t:notes[0].t - 0.16, kind:'phrase', notes, reg:song.register,
                   gain: song.mood==='aggro' ? 0.24 : 0.21, vibRate, vibDepth});
      lines.push({si:bar.si, li:bar.li, text:bar.text, syls:lineSyls,
                  t0:lineSyls[0].t, t1:t0+LINE_BARS*barD});
    }
  });

  events.sort((a,b)=>a.t-b.t);
  return { events, lines, dur: plan.length*barD + 0.8, song };
}

/* ================================================================
   6 · THE VOICE
   One glottal source per line. The formants move continuously from
   consonant locus to vowel to the next consonant, so the line is
   sung as a phrase instead of as a row of separate notes.
   ================================================================ */
const Engine = (()=>{
  let ctx, master, comp, analyser, data, glot;
  let nodes=[], timer=null, startAt=0, idx=0, arr=null, cur=null, cb={};

  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.6;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.01;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    data = new Uint8Array(analyser.frequencyBinCount);
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
  }
  /* a glottal pulse has a steeper spectral slope than a sawtooth —
     that one change takes most of the buzz out of the voice */
  function glottal(){
    if (glot) return glot;
    const N = 26, real = new Float32Array(N), imag = new Float32Array(N);
    for (let n=1;n<N;n++) imag[n] = 1/Math.pow(n,1.75);
    glot = ctx.createPeriodicWave(real, imag, {disableNormalization:false});
    return glot;
  }

  function tone(e, at){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = e.type; o.frequency.value = e.f;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(e.gain, at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at+e.dur);
    o.connect(g);
    let out = g;
    if (e.filt){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=e.filt; g.connect(f); out=f; }
    out.connect(master);
    o.start(at); o.stop(at+e.dur+0.05);
    nodes.push(o);
  }
  function noise(e, at){
    const len = Math.max(2, Math.floor(ctx.sampleRate*e.dur));
    const buf = ctx.createBuffer(1,len,ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i=0;i<len;i++) ch[i] = (Math.random()*2-1)*Math.pow(1-i/len,3);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const g = ctx.createGain(); g.gain.value = e.gain;
    const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = 5200;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at); nodes.push(s);
  }
  function hiss(at, dur, freq, q, gain, shape){
    if (at < ctx.currentTime) at = ctx.currentTime;
    const len = Math.max(2, Math.floor(ctx.sampleRate*dur));
    const buf = ctx.createBuffer(1,len,ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i=0;i<len;i++){
      const p = i/len;
      ch[i] = (Math.random()*2-1) * (shape==='burst' ? Math.pow(1-p,4) : Math.sin(Math.PI*Math.min(1,p*3.2)));
    }
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = Math.min(freq, ctx.sampleRate/2-200); bp.Q.value = q;
    const g = ctx.createGain(); g.gain.value = gain;
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(at); nodes.push(s);
  }

  function phrase(e, base){
    const reg = REGISTERS[e.reg] || REGISTERS.alto, sh = reg.shift;
    const notes = e.notes, now = ctx.currentTime;
    const nyq = ctx.sampleRate/2 - 200;
    const F = f => Math.min(f*sh, nyq);
    const t0   = Math.max(now+0.02, base + notes[0].t);
    const tEnd = base + notes[notes.length-1].t + notes[notes.length-1].dur;
    if (tEnd <= now + 0.05) return;

    // ---- glottal source ----
    const osc = ctx.createOscillator();
    osc.setPeriodicWave(glottal());
    osc.frequency.setValueAtTime(notes[0].f*0.94, t0);
    osc.frequency.exponentialRampToValueAtTime(notes[0].f, t0+0.11);       // scoop in
    let prevF = notes[0].f, lastPitchT = t0+0.11;
    notes.forEach((n,i)=>{
      if (!i) return;
      const t = Math.max(lastPitchT+0.02, base+n.t);
      const slur = n.syl.first ? 0.05 : 0.028;    // slide between words, quicker inside one
      const a = Math.max(lastPitchT+0.005, t-slur);
      osc.frequency.setValueAtTime(prevF, a);
      osc.frequency.exponentialRampToValueAtTime(n.f, t+0.015);
      prevF = n.f; lastPitchT = t+0.02;
    });

    // ---- vibrato, only where a note is long enough to hold ----
    const lfo = ctx.createOscillator(); lfo.frequency.value = e.vibRate;
    const lg  = ctx.createGain(); lg.gain.setValueAtTime(0, t0);
    notes.forEach(n=>{
      const t = Math.max(t0, base+n.t);
      const depth = n.dur > 0.4 ? n.f*e.vibDepth : 0;
      lg.gain.setValueAtTime(lg.gain.value||0, t);
      lg.gain.linearRampToValueAtTime(depth, t+Math.min(0.32, n.dur*0.65));
    });
    lfo.connect(lg); lg.connect(osc.frequency);
    lfo.start(t0); lfo.stop(tEnd+0.2);

    // ---- one amplitude envelope for the whole line ----
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(e.gain, t0+0.07);
    notes.forEach((n,i)=>{
      if (!i) return;
      const t = base+n.t, w = Math.min(0.05, n.dur*0.28);
      const lead = CONS[(n.syl.onset||[]).slice(-1)[0]];
      const dip = lead ? (lead.k==='stop' ? 0.03 : lead.k==='fric'||lead.k==='affr' ? 0.12 : 0.45) : 0.72;
      env.gain.setValueAtTime(e.gain, Math.max(t0+0.08, t-w*2));
      env.gain.linearRampToValueAtTime(e.gain*dip, t-w*0.35);
      env.gain.linearRampToValueAtTime(e.gain, t+w);
    });
    env.gain.setValueAtTime(e.gain, Math.max(t0+0.1, tEnd-0.1));
    env.gain.exponentialRampToValueAtTime(0.0001, tEnd+0.07);
    osc.connect(env);

    // breath before the line, and breathiness under the first vowel
    hiss(t0-0.13, 0.12, 900, 0.4, e.gain*0.16, 'hiss');
    hiss(t0, 0.1, 2200, 0.5, e.gain*0.2, 'hiss');

    // ---- formants: three moving bands, one fixed singer's formant, one nasal band ----
    const mix = ctx.createGain();
    const bands = [0,1,2].map(i=>{
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.Q.value = 7 + i*4;
      const g = ctx.createGain(); g.gain.value = [1,0.62,0.36][i];
      env.connect(bp); bp.connect(g); g.connect(mix);
      return bp;
    });
    const sing = ctx.createBiquadFilter();                 // the singer's formant, ~3kHz presence
    sing.type='bandpass'; sing.frequency.value = F(3050); sing.Q.value = 9;
    const singG = ctx.createGain(); singG.gain.value = 0.2;
    env.connect(sing); sing.connect(singG); singG.connect(mix);

    const nasal = ctx.createBiquadFilter();                // switched in for nasal vowels
    nasal.type='bandpass'; nasal.frequency.value = 260; nasal.Q.value = 8;
    const nasalG = ctx.createGain(); nasalG.gain.setValueAtTime(0, t0);
    env.connect(nasal); nasal.connect(nasalG); nasalG.connect(mix);

    const dry = ctx.createGain(); dry.gain.value = 0.12;
    env.connect(dry); dry.connect(mix);
    mix.connect(master);

    // formant automation across the whole phrase
    const cur3 = [F(V.schwa[0]), F(V.schwa[1]), F(V.schwa[2])];
    bands.forEach((bp,i)=> bp.frequency.setValueAtTime(cur3[i], t0));
    let lastT = t0;
    notes.forEach((n,k)=>{
      const s = n.syl;
      const tS = Math.max(lastT+0.01, base+n.t), tE = tS + n.dur;
      const [v1, v2] = vowelTargets(s.nuc);
      const lead  = CONS[(s.onset||[]).slice(-1)[0]];
      const codaC = CONS[(s.coda||[])[0]];
      const glideAt = tS + n.dur*0.45, glideTo = tS + n.dur*0.82;

      bands.forEach((bp,i)=>{
        if (lead){
          const a = Math.max(lastT+0.005, tS - Math.min(0.05, n.dur*0.4));
          bp.frequency.setValueAtTime(cur3[i], a);
          bp.frequency.linearRampToValueAtTime(F(lead.locus[i]), tS-0.004);
        }
        bp.frequency.linearRampToValueAtTime(F(v1[i]), tS + Math.min(0.055, n.dur*0.35));
        cur3[i] = F(v1[i]);
        if (v2 && glideTo > glideAt){
          bp.frequency.setValueAtTime(cur3[i], glideAt);
          bp.frequency.linearRampToValueAtTime(F(v2[i]), glideTo);
          cur3[i] = F(v2[i]);
        }
        if (codaC && tE-0.05 > glideTo){
          bp.frequency.setValueAtTime(cur3[i], tE-0.05);
          bp.frequency.linearRampToValueAtTime(F(codaC.locus[i]), tE);
          cur3[i] = F(codaC.locus[i]);
        }
      });
      // nasal vowels get a low nasal resonance mixed in
      const isNasal = NASAL.has(s.nuc) || (DIPH[s.nuc] && NASAL.has(DIPH[s.nuc][0]));
      nasalG.gain.setValueAtTime(nasalG.gain.value||0, Math.max(t0, tS-0.02));
      nasalG.gain.linearRampToValueAtTime(isNasal ? 0.5 : 0, tS+0.04);

      // consonant noise
      const onDur = lead ? Math.min(lead.dur, n.dur*0.4) : 0;
      const cAt = Math.max(now, tS - onDur);
      const pre = CONS[(s.onset||[])[0]];
      if (pre && s.onset.length>1){
        if (pre.k==='fric'||pre.k==='affr') hiss(cAt, Math.min(pre.dur, onDur*0.7), pre.band, pre.q, e.gain*0.5,'hiss');
        else if (pre.k==='stop') hiss(cAt, 0.02, pre.burst, pre.bw, e.gain*0.5,'burst');
      }
      if (lead){
        if (lead.k==='fric') hiss(cAt, Math.max(0.025, onDur), lead.band, lead.q, e.gain*0.55,'hiss');
        if (lead.k==='affr'){ hiss(cAt, 0.018, lead.burst, 1.2, e.gain*0.5,'burst');
                              hiss(cAt+0.018, Math.max(0.02, onDur-0.018), lead.band, lead.q, e.gain*0.5,'hiss'); }
        if (lead.k==='stop'){ hiss(tS-0.024, 0.022, lead.burst, lead.bw, e.gain*0.75,'burst');
                              if (lead.asp) hiss(tS-0.004, 0.03, 1800, 0.4, e.gain*0.3,'hiss'); }
      }
      if (codaC){
        const cd = Math.min(codaC.dur, n.dur*0.3);
        if (codaC.k==='fric'||codaC.k==='affr') hiss(tE-cd*0.5, codaC.dur, codaC.band, codaC.q, e.gain*0.5,'hiss');
        if (codaC.k==='stop') hiss(tE+0.012, 0.02, codaC.burst, codaC.bw, e.gain*0.4,'burst');
        const second = CONS[(s.coda||[])[1]];
        if (second && (second.k==='fric'||second.k==='affr'))
          hiss(tE+0.02, second.dur, second.band, second.q, e.gain*0.4,'hiss');
      }
      lastT = tE;
    });

    osc.start(t0); osc.stop(tEnd+0.2);
    nodes.push(osc, lfo);
  }

  function tick(){
    if (!arr) return;
    const now = ctx.currentTime;
    while (idx < arr.events.length && startAt + arr.events[idx].t < now + 0.5){
      const e = arr.events[idx++];
      if (e.kind === 'phrase') phrase(e, startAt);
      else if (e.kind === 'noise') noise(e, Math.max(now, startAt+e.t));
      else tone(e, Math.max(now, startAt+e.t));
    }
    if (now > startAt + arr.dur) stop();
  }
  function play(id, arrangement, callbacks){
    if (cur === id){ stop(); return false; }
    stop(); ensure();
    if (ctx.state === 'suspended') ctx.resume();
    arr = arrangement; cur = id; cb = callbacks||{};
    idx = 0; startAt = ctx.currentTime + 0.25;
    timer = setInterval(tick, 40); tick();
    return true;
  }
  function stop(){
    if (timer){ clearInterval(timer); timer=null; }
    nodes.forEach(n=>{ try{ n.stop(); }catch(_){} });
    nodes = [];
    const done = cb.onEnd; cur=null; arr=null; cb={};
    if (done) done();
  }
  return { play, stop,
    get playing(){ return cur; },
    elapsed(){ return ctx ? ctx.currentTime - startAt : 0; },
    levels(){ if (!analyser) return null; analyser.getByteFrequencyData(data); return data; } };
})();
/* ================================================================
   7 · CHAT
   ================================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const thread=$('#thread'), scroller=$('#scroll'), input=$('#input'), sendBtn=$('#send'), langSel=$('#langSel');
let lastSong=null, lastIntent=null, songCount=0, pendingThin=null;

const SEEDS = [
  { t:"Missing the last train home",              s:"slow, tenor voice" },
  { t:"A chuva em Lisboa e ninguém à espera",     s:"em português, lento" },
  { t:"My grandmother's kitchen in summer",       s:"warm, funny, soprano" },
  { t:"Une nuit blanche à attendre un message",   s:"en français, piano" }
];

function renderEmpty(){
  thread.innerHTML='';
  const box = el('div','empty-state');
  box.appendChild(el('h1',null,'What should the song be about?'));
  box.appendChild(el('p',null,'Give me an idea, a memory or one blunt sentence — in English, português, español, français or italiano. I’ll work out what you want, write the lyrics, and sing them.'));
  const seeds = el('div','seeds');
  SEEDS.forEach(s=>{
    const b = el('button','seed', `<b>${esc(s.t)}</b><span>${esc(s.s)}</span>`);
    b.onclick = ()=> submit(s.t + ' — ' + s.s);
    seeds.appendChild(b);
  });
  box.appendChild(seeds);
  thread.appendChild(box);
}
const scrollDown = ()=>{ scroller.scrollTop = scroller.scrollHeight; };

function addUser(text){
  const m = el('div','msg user'); m.appendChild(el('div','body', esc(text)));
  thread.appendChild(m); scrollDown();
}
function addBot(){
  const m = el('div','msg bot'); m.appendChild(el('div','avatar','♪'));
  const body = el('div','body'); m.appendChild(body); thread.appendChild(m); scrollDown();
  return body;
}
function think(body, ms){
  const d = el('div','dots','<span></span><span></span><span></span>');
  body.appendChild(d);
  return new Promise(res=>setTimeout(()=>{ d.remove(); res(); }, ms));
}
function stream(body, text){
  return new Promise(res=>{
    const p = el('p'); body.appendChild(p);
    const words = text.split(' '); let i=0;
    const caret = el('span','caret'); p.appendChild(caret);
    const iv = setInterval(()=>{
      caret.insertAdjacentText('beforebegin', (i?' ':'')+words[i]); i++; scrollDown();
      if (i>=words.length){ clearInterval(iv); caret.remove(); res(p); }
    }, 20);
  });
}

/* what the model understood, shown as chips */
function readChips(intent, song){
  const box = el('div','read');
  const add = (txt, plain)=>{ const s=el('span',plain?'plain':null, esc(txt)); box.appendChild(s); };
  add(LANGS[song.lang].label);
  add({dark:'melancholy',bright:'warm',aggro:'angry'}[song.mood]);
  add(song.bpm + ' bpm');
  add(REGISTERS[song.register].name);
  if (song.instr && song.instr.length) song.instr.forEach(i=>add(i, true));
  if (intent.noChorus) add('no chorus', true);
  if (song.sections.some(s=>/bridge|ponte|puente|pont/i.test(s.label))) add('bridge', true);
  if (song.explicit) add('explicit', true);
  return box;
}

function renderSheet(song){
  const sheet = el('div','sheet');
  const head = el('div','sheet-head');
  head.innerHTML = `<b>${esc(song.title)}</b>`
    + (song.explicit ? '<span class="flag">EXPLICIT</span>' : '')
    + `<span class="meta">${esc(song.keyName)} · ${song.bpm} bpm · ${REGISTERS[song.register].name} · ${esc(LANGS[song.lang].label)}</span>`;
  sheet.appendChild(head);
  const body = el('div','sheet-body');
  song.sections.forEach((sec, si)=>{
    body.appendChild(el('div','section-label', esc(sec.label)));
    sec.lines.forEach((text, li)=>{
      const line = el('div','line dim'); line.dataset.key = si+'-'+li;
      syllabifyLine(text, song.lang).forEach((syl,k)=>{
        const s = el('span','syl', esc(syl.txt)); s.dataset.k=k; line.appendChild(s);
      });
      body.appendChild(line);
    });
  });
  sheet.appendChild(body);
  return sheet;
}

const PLAY="M8 5v14l11-7z", PAUSE="M6 5h4v14H6zm8 0h4v14h-4z";
function renderPlayer(song, sheet, id){
  const p = el('div','player');
  p.innerHTML = `
    <button class="pbtn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="${PLAY}"/></svg></button>
    <div class="pinfo">
      <b>${esc(song.title)}</b>
      <span class="meta">${esc(song.genre)} · ${esc(song.keyName)} · ${song.bpm} bpm · ${REGISTERS[song.register].name}</span>
      <div class="bar"><i></i></div>
    </div>
    <canvas class="viz"></canvas>`;
  const btn=p.querySelector('.pbtn'), path=p.querySelector('path');
  const fill=p.querySelector('.bar i'), canvas=p.querySelector('canvas');
  const arr = arrange(song);
  let raf=null, lastKey=null;

  function clear(){
    sheet.querySelectorAll('.line').forEach(l=>{ l.classList.remove('active'); l.classList.add('dim'); });
    sheet.querySelectorAll('.syl').forEach(s=>s.classList.remove('sung','now'));
  }
  function frame(){
    const t = Engine.elapsed();
    fill.style.width = Math.min(100,(t/arr.dur)*100)+'%';
    arr.lines.forEach(line=>{
      const node = sheet.querySelector(`.line[data-key="${line.si}-${line.li}"]`);
      if (!node) return;
      const on = t >= line.t0-0.3 && t < line.t1;
      node.classList.toggle('active', on);
      node.classList.toggle('dim', !on);
      if (on){
        const key = line.si+'-'+line.li;
        if (key !== lastKey){ lastKey = key; node.scrollIntoView({block:'nearest'}); }
      }
      line.syls.forEach((syl,k)=>{
        const s = node.children[k]; if (!s) return;
        const now = t >= syl.t && t < syl.t + Math.max(syl.dur,0.12);
        s.classList.toggle('now', now);
        s.classList.toggle('sung', !now && t >= syl.t && on);
      });
    });
    drawViz(canvas);
    raf = requestAnimationFrame(frame);
  }
  btn.onclick = ()=>{
    const started = Engine.play(id, arr, { onEnd(){
      path.setAttribute('d',PLAY);
      if (raf) cancelAnimationFrame(raf); raf=null;
      fill.style.width='0%'; clear(); drawViz(canvas);
    }});
    path.setAttribute('d', started?PAUSE:PLAY);
    if (started){ if (raf) cancelAnimationFrame(raf); frame(); }
  };
  return { node:p, start(){ btn.click(); } };
}
function drawViz(canvas){
  const dpr = window.devicePixelRatio||1, rect = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(rect.width*dpr)){
    canvas.width = Math.max(1,Math.round(rect.width*dpr));
    canvas.height= Math.max(1,Math.round(rect.height*dpr));
  }
  const c = canvas.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const w = canvas.width/dpr, h = canvas.height/dpr;
  c.clearRect(0,0,w,h);
  const d = Engine.playing ? Engine.levels() : null;
  const css = getComputedStyle(document.documentElement);
  const bars=12, bw=Math.max(1,(w-(bars-1)*2)/bars);
  for (let i=0;i<bars;i++){
    const v = d ? Math.pow(d[Math.floor(i*d.length/bars/2.4)]/255,1.4) : 0.07;
    const bh = Math.max(2, v*h);
    c.fillStyle = (d ? css.getPropertyValue('--accent') : css.getPropertyValue('--line')).trim();
    c.globalAlpha = d ? 0.45+v*0.55 : 1;
    const x = i*(bw+2);
    c.beginPath();
    c.roundRect ? c.roundRect(x,(h-bh)/2,bw,bh,Math.max(0,Math.min(bw/2,2))) : c.rect(x,(h-bh)/2,bw,bh);
    c.fill();
  }
  c.globalAlpha = 1;
}

/* --- follow-up edits, in any of the languages --- */
function parseEdit(text){
  if (!lastSong) return null;
  const st = ' ' + strip(text) + ' ';
  const o = {}; let touched = false;
  if (ASK.fast.test(st)){ o.bpm = Math.min(190, Math.round(lastSong.bpm*1.22)); touched=true; }
  if (ASK.slow.test(st)){ o.bpm = Math.max(50, Math.round(lastSong.bpm*0.8)); touched=true; }
  if (ASK.angry.test(st)){ o.mood='aggro'; touched=true; }
  else if (ASK.sad.test(st)){ o.mood='dark'; touched=true; }
  else if (ASK.happy.test(st)){ o.mood='bright'; touched=true; }
  ['soprano','alto','tenor','bass'].forEach(v=>{ if (ASK[v].test(st)){ o.register=v; touched=true; } });
  for (const [re,code] of ASK.lang){ if (re.test(text)){ o.lang=code; touched=true; break; } }
  if (/\b(different|other|new) (lyrics|words)\b|outra letra|otra letra|autres paroles|altro testo|rewrite|reescreve|de novo|again|another version/i.test(text)){
    o.salt = String(Math.random()); touched = true;
  }
  // an edit is only an edit if it isn't carrying a new idea
  const L = LANGS[lastSong.lang];
  const content = strip(text).split(/\s+/).filter(w=>w.length>3 && !L.stop.has(w) && !LANGS.en.stop.has(w));
  return (touched && content.length <= 4) ? o : null;
}

function addHistory(song, anchor){
  const hist = $('#hist');
  hist.querySelector('.empty')?.remove();
  const b = el('button', null, esc(song.title));
  b.onclick = ()=>{ [...hist.children].forEach(c=>c.classList.remove('on')); b.classList.add('on');
                    anchor.scrollIntoView({behavior:'smooth', block:'start'}); };
  hist.prepend(b);
  [...hist.children].forEach(c=>c.classList.remove('on'));
  b.classList.add('on');
}

/* --- one turn --- */
async function submit(text){
  text = (text||'').trim();
  if (!text) return;
  if (thread.querySelector('.empty-state')) thread.innerHTML='';
  addUser(text);
  input.value=''; input.style.height='auto'; sendBtn.disabled=true;

  // answering the clarifying question
  if (pendingThin){ text = pendingThin + ' — ' + text; pendingThin = null; }

  const edit = parseEdit(text);
  const body = addBot();
  await think(body, 520 + Math.random()*380);

  let song, intent, opener;
  if (edit){
    intent = Object.assign({}, lastIntent, edit.lang ? {lang:edit.lang} : {});
    song = writeSong(intent, Object.assign({salt:String(Math.random())}, edit));
    const L = LANGS[song.lang], bits = [];
    if (edit.bpm) bits.push(edit.bpm > lastSong.bpm ? 'tempo up' : 'tempo down');
    if (edit.mood) bits.push({dark:'more melancholy',bright:'warmer',aggro:'angrier'}[edit.mood]);
    if (edit.register) bits.push(edit.register + ' voice');
    if (edit.lang) bits.push(LANGS[edit.lang].label);
    if (!bits.length) bits.push('new words');
    opener = L.say.edited(bits.join(', '));
  } else {
    intent = parseIntent(text, lastSong && lastSong.lang);
    if (langSel.value !== 'auto') intent.lang = langSel.value;
    if (intent.thin){
      const L = LANGS[intent.lang];
      await stream(body, L.say.thin);
      const quick = el('div','quick');
      L.say.thinOpts.forEach(opt=>{
        const b = el('button', null, esc(opt));
        b.onclick = ()=>{ quick.remove(); submit(opt); };
        quick.appendChild(b);
      });
      body.appendChild(quick); scrollDown();
      pendingThin = text;
      return;
    }
    song = writeSong(intent, {});
    opener = describe(song);
  }
  lastSong = song; lastIntent = intent;

  body.appendChild(readChips(intent, song));
  await stream(body, opener);

  const sheet = renderSheet(song);
  body.appendChild(sheet);

  const L = LANGS[song.lang];
  const id = 'song'+(++songCount);
  const actions = el('div','actions');
  const createBtn = el('button','create', L.say.create);
  const voiceSel  = el('select','mini');
  ['auto','soprano','alto','tenor','bass'].forEach(v=>{
    const o = document.createElement('option');
    o.value=v; o.textContent = v==='auto' ? 'Voice: '+REGISTERS[song.register].name : 'Voice: '+v;
    voiceSel.appendChild(o);
  });
  const againBtn = el('button','mini', L.say.again);
  actions.append(createBtn, voiceSel, againBtn);
  body.appendChild(actions); scrollDown();

  createBtn.onclick = async ()=>{
    if (voiceSel.value !== 'auto') song.register = voiceSel.value;
    createBtn.disabled = true; createBtn.textContent = L.say.composing;
    await new Promise(r=>setTimeout(r,650));
    createBtn.remove(); voiceSel.remove(); againBtn.remove();
    const player = renderPlayer(song, sheet, id);
    body.appendChild(player.node); scrollDown();
    player.start();
    addHistory(song, body.parentElement);
  };
  againBtn.onclick = ()=> submit({en:'different words',pt:'outra letra',es:'otra letra',fr:'autres paroles',it:'altro testo'}[song.lang]);
}

input.addEventListener('input', ()=>{
  input.style.height='auto';
  input.style.height = Math.min(input.scrollHeight,180)+'px';
  sendBtn.disabled = !input.value.trim();
});
input.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(input.value); } });
sendBtn.onclick = ()=> submit(input.value);
$('#newBtn').onclick = ()=>{ Engine.stop(); lastSong=null; lastIntent=null; pendingThin=null; renderEmpty(); };
$('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('hide');
if (window.innerWidth > 860) $('#sidebar').classList.remove('hide');
window.addEventListener('resize', ()=>{ if (window.innerWidth>860) $('#sidebar').classList.remove('hide'); });

renderEmpty();
</script>
